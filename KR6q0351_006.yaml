body:
  text: 小師曇頓等編偈贈景首座睦州嗣黃蘗靈樹待雲門如此人天眼光明耀乾坤機奪機兮楔出楔逆順縱橫誰辨別師資會遇兮啐同時賓主相忘兮敲唱合節坐斷玄關正令行後世何人繼清絕上人自是英俊流壯年志氣衝斗牛集雲峰下分半座宏規落落追前修領徒行脚遊江海勘遍諸方誠絕待抖擻行囊一物無七尺烏藤手中在朅來訪我深雲間話到無言心亦閑推出秦時𨍏轢鑽等閑靠倒須彌山送輪藏主生佛已前一句子不惜眉毛為君舉開口分明落二三塞却耳根須聽取只今法道何澆漓談玄說妙誇傳持逐塊韓盧知幾幾咬人罕覩獅子兒豈不見臨濟三回問黃檗六十烏藤沒商略高安灘上驀翻身倒捋虎鬚施痛摑道人棄教來參禪𢬵得禁吾劈面拳藏裏摩尼親搆得直須擊碎歐峰前掉臂堂堂出門去春光爛熳江南路鷓鴣啼處百花香鳳栖不在梧桐樹送要侍者道人要學呆來入呆菴室呆菴教汝呆有口說不出不說亦不聞無得亦無失掉頭遊諸方拄杖挑紅日笑他老香林紙襖黑如漆三三不是九九九八十一送閒長老歸寶勝君不見夾山散席見船子一篙打落滄波裏死眼豁開忽點頭始信道吾發笑良有以又不見黃龍行脚見慈明痛罵不禁魂膽驚踏著趙州關棙子方知雲峯出語非常情近來此話憑誰舉說妙談玄滿寰宇若約衲僧門下看到頭未敢輕相許子今得座披衣時東探西討何所為未跨船舷先轉却茫茫大地無宗師憶昔游從非一日笑語自能忘得失信曾親見作家來平生參學事已畢明朝復相別後會未可期更有一語送爾歸爾歸故山慎勿違曉行須待紅日出毋使霜露沾麻衣送明禪人道人走遍諸方畢竟為箇甚麼決欲究明死生直須從前放下便請拗折烏藤試向虗堂靜坐忽然豆𪹼寒灰痛口不妨罵我我既不識慚惶一味如聾若啞笑他昔日睦州拶得雲門脚跛贈詢藏主老僧燕坐枯木床心入無言妙三昧山陰禪者來扣門手展雲箋覓長偈長偈欲書不盡書鐵鞭擊碎摩尼珠如來藏裏收不得神光炯炯騰寒虗驚起南山白額虎木人拍板空中舞東土西乾沒祖師五五依然二十五贈閑藏主道人脊梁鐵作骨拄杖橫拖眼如鶻遍尋知識走叢林開口欲吞三世佛金鰲背上解翻身笑指凌霄高突兀搆得如來藏裏珠等閑抹過蒼龍窟道友二人過予夜話一友云此事至難不可得而擬議一友云此事至易但自不能承當耳因喻之以二首難難萬種千般纔擬議即顢頇青天霹𮦷平地波瀾無說是真說他觀非正觀沉淪枉經巨劫契悟祇在毫端莫教坐却含元殿逢人只管覓長安易易多方一致絕承當忘比喻耀古騰今經天緯地知有亦無知利他還自利明明般若真乘念念塵勞雜事拔却多年苦瓠根釋迦不受然燈記贈範藏主藏裏摩尼人不識護龍河上親收得朅來托起歐峰前一道神光射虗碧置之濁水濁水清山鬼見之魂膽驚我欲為渠即奪却棄與昏衢為照明仰山傾出一栲栳狼籍叢林非小小子今護惜是至寶究竟何如放下好呆菴所說無所憑不妨携取歸金陵隨方應現色非色老胡兩眼猶晶熒送慧維那翠巖接雲峰克賓嗣興化師資授受良非輕千古叢林成話欛道人欲繼先賢蹤特披荊棘來相從法戰不須論勝負宗壇及第期心空我今縛屋孤峰頂心識多年似灰冷懶將棒喝對人施仰視青天白日靜道人復作諸方遊殷勤索我舉話頭話頭舉起只這是太平何用施戈矛贈冲藏主歎息復歎息向上之機誰辨的曲彔據坐非不多接響承虗亦何益君不見虎丘只是隆知藏特立宗壇名籍籍冲禪德冲禪德大方高蹈須勉力煙霞老我寸心灰要覩叢林古顏色琪藏主求佛祖頂𩕳機超越諸限量拶透通天關所得方諦當道人當壯年立志能向上拄杖挑囊東西遍參訪再登凌霄峰雅慕古人樣操守尚精嚴結交匪庸妄往來不往來是藏不是藏觸目甚分明開口翻成謗莫聽杜阿師密語相諂誑到家審思量別有奇特相送恒藏主把住玄關不通水泄向上一著如何辨別直饒辯似河傾機如電掣到這裏也須卸甲倒戈亡鋒結舌說甚麼棒喝交馳敲唱合節所以道金毛踞地奮全威野干聞之皆腦裂只如臨濟正法眼藏因甚却向瞎驢邊滅雖然有主有賓到底無示無說恒禪恒禪知不知昔何時也今何時少林曲調天然別黃金不鑄鍾子期次韻送靈隱真藏主毗盧正體堂堂露古往今來沒差互一毫端上洞根源如日行空恰當午因憶江西馬大師聲光烜赫騰坤維真正舉揚機自別棒頭喝下看提持伶俐衲僧快須證據不得無言不得下語掀翻藏教葛藤窠千手大悲攔不住草中驚起睡菸菟咬殺南山白額虎送達藏主達磨未來已前人人鼻孔撩天天真之佛不昧日用頭頭現前逗到遊梁涉魏未免骨露皮穿神光錯禮三拜從茲燄續芳聯臨濟更無本據却將一喝流傳誰知正法眼藏滅向這瞎驢邊老我口生白醭何暇為人說禪明日洞庭歸去不妨順水行船送宗藏主宗門向上事無傳亦無受紙襖抄得來未免揚家醜老我五峰巔為人懶開口每遇入室徒大棓劈脊摟雖不別機宜貴在脫窠臼若是英靈兒機先合知有藏教五千餘流布日已久盡底為掀翻不妨誇好手勘破老雲門一舉四十九送智知客智不到處切忌道著機先桚透祖師關聖解凡情盡拈却豈不見大陽寺裏顯知客笑倒傍觀韓大伯猊床高據乳峰頭千古聲名何烜赫送澤藏主澤廣藏山理能伏豹眾生永息攀緣諸佛本無言教趙州為婆子轉藏太殺顢頇善慧對梁皇講經不妨賣峭當知觸處逢源切忌隨機失照道人學脫空一心求實効訪我凌霄巔踏著通天竅烏藤倒握便翻身方外悠悠恣高蹈送琇藏主透過龍門赤梢鯉翻身藏海波濤起拏雲攫霧勢未休終不淹他虀甕裏老僧靜處薩婆訶終朝兩眼懸松蘿秋入叢林正枯稿疇能沾沃傾天河魚龍變化固莫測上人此行宜勉力百丈重參馬大師曾聞一喝聾三日送念藏主真誠學道人脊梁硬如鐵正念常現前玄關俱洞徹拈起犀牛扇清風撼寥泬拓開無盡藏驪珠耀明月掉頭歸去來不墮他途轍出林獅子兒奮迅天然別送如侍者如來頓教門一超能直入截斷知見根脫去情塵執啐在當機何啻劈箭急曾不假思惟誰云涉階級百丈參馬師側侍繩床立掛拂驀遭呵掩耳終莫及點鐵作精金靈丹只一粒送塤侍者馬祖陞堂百丈捲席大用全彰神機罔測如磁引針似鏃破的父子傳持本無妙密眷爾塤禪來入吾室跳出葛藤撞著鐵壁熱喝真拳雷轟電激擬心即乖開口即失裂破古今不妨奇特倒捋虎鬚唯白拈賊送昋侍者鳥窠吹布毛侍者便悟去機投輥芥針徒誇箭鋒拄日出天宇高雲收山嶽露明明絕覆藏了了無回互拶透上頭關踏著來時路四七與二三密意不相付送樹藏主最初機末後句未開口時知落處鳥窠拈起布毛吹會通侍者便悟去如來教祖師禪了無密意堪流傳日用現行明歷歷靈光洞徹威音前一大藏教對一說明眼衲僧難辨別南海波斯笑展眉金剛腦後三斤鐵送瀚藏主侍者參得禪千了與百當翻身更那邊拶透如來藏就中探出摩尼珠靈光烜赫騰十虗是聖是凡難近傍爍迦羅眼那能窺老僧一見即奪却特地從頭問渠索無事相將草裏行笑倒東村王大伯噫噓嘻無人知橫拈鐵笛順風吹十影神駒立海涯九苞祥鳳凌空飛送蓀藏主參到無參學到無學無師之智忽現前聖解凡情盡拈却一大藏教是箇切脚東山解道鉢囉娘梵語唐言該不著道人近自雲峰來探玄有志非凡才截斷從前知見網龍門一躍生風雷兔角拄杖活鱍鱍卓向虗空任拈掇休誇臨濟小廝兒黃檗虎鬚曾倒捋送啟藏主大啟重關延巨敵等閑捉住白拈賊三玄戈甲謾施呈齧鏃當機須辨的堪笑文遠與趙州爭鋒唇舌無來繇只圖鬬劣不鬬勝豈知父子成冤讎何如深入毗盧藏是聖是凡難近傍把住乾坤正令行傑出古今真榜樣有時縱奪奮全威哮吼一聲獅子兒金剛出匣光𦦨𦦨爍迦羅眼那能窺送謙首座回受經八紘雲淨秋氣高風生桂岫天香飄堂中上座定初起卷衣欲渡龍江潮再四留之不肯住鐵錫橫肩出門去他日重來捋虎鬚啐當機箭鋒拄少林一曲聽者難無絃之琴誰復彈老我凌霄倚庭樹摩挲兩眼看鵬摶歌臥雲軒為前水西大機禪師作臥雲軒中人塵事不相到心與雲俱閑看雲聊寄傲雲之從龍自可期達人應世當有時廼知舒卷本無跡六合茫茫隨所適殷勤為告臥雲人雲中有路須致身大地蒼生望霖雨胡為久臥南湖濵空外歌并序東林實藏主字空外求余作偈以證其說因謂之曰空無內外內外性空性空亦空畢竟空中無名字相離言說相汝之立名大似夾截虗空我更說偈何異彩畵虗空耶實曰我立空名師說空偈以空納空不亦可乎余不意廬山界有此脫空漢於是擊禪板為之歌曰真性等虗空廓徹無內外不即亦不離非向亦非背若人一念能融通頭頭物物明真宗十方蕩蕩沒邊表古往今來體用同同不同異不異空外之說無實義一機抹過威音前舜若多神脚踏地有時空外來頭峭五嶽高崔嵬重重無盡華藏界一一從頭都拓開有時空外去千手大悲攔不住翻身踢倒七金山剎剎塵塵是歸路阿呵呵還會麼當陽唱起脫空歌快活誰能奈我何溪上石人相耳語無毛鐵過新羅大用歌選佛得甲科今古誰能敵大用常現前何須存軌則驪龍頷下抉明珠赤手曾編猛虎鬚虗空背上翻筋斗藕絲竅裏同安居機先捉住白拈賊正按旁提人不識眉間掛劒真自奇透過金圈吞栗棘看他天生意氣脫體風流直上非非想處輥出須彌作綉毬驀過他方阿僧祇世界轉身接向脚跟頭阿呵呵好不好南北東西何處討一毫端上識根源是聖是凡都靠倒比來逢大用索我大用歌自慚才力小奈爾大用何試將一滴曹溪水漲起西江浩渺之洪波波光冷浸琉璃碧沃日滔天深莫測信口吸教徹底乾灼然不費纖毫力報君知休驚疑衲僧向上更有提持明投暗合兮全收全放左轉右旋兮不即不離大方內外皆充塞妙用縱橫無盡時呆菴歌并序余以癡鈍自守隨所住處扁曰呆菴客有譏曰世人以機巧相尚其來久矣子欲全其呆而矯諸不亦迂乎余因謝其客曰靈利漢有此分別爾客既去於是作呆菴歌一首以寫呆意覽者勿以工拙論之可也我此呆菴呆道人不識世間秋與春兀兀癡癡只麼過無榮無辱無疎親或把精金和土賣或收燕石藏為珍笑倒傍觀靈利漢讚亦不喜罵不嗔有問呆菴何所作閑看葫蘆懸壁角當陽拈起鈍鐵鍬擬向虗空去穿鑿門戶長年八字開屋裏從來空索索多被時流驀面欺一生莽鹵都不覺可怪呆人百不能對人呆話還可憎剛道夜深芻犬吠大洋海底人挑燈更有一般呆伎倆兩耳卓朔頭鬅鬙任你客僧逞機巧東呼西喚渠不應無言歌并序無言藏主以其號求作歌余屢不答而請益堅乃謂之曰余作是歌久矣汝自不聞耳粤云師既無言而言亦當言所無言豈復有所分別耶余為一笑而援筆書偈以塞其請無言上人求我歌我正無言樂禪寂兀然不答坐堆堆兩眼倀倀掛空壁上人良久乃出門此事分明誰與論日輪杲杲初卓午松風颼颼聲滿軒維摩示疾毗耶離只應惹得文殊至到了何曾措一詞不二門開洞天地汝今無聞我無說覿面當機還直截無位真人笑臉開憍梵提驚吐舌雲海歌為慈藏主作慈雲蔭覆廣無邊覺海圓澄深莫測都來只在一毫頭拋向面前人不識從他布影遍十方恒洒甘露甦焦枯含攝三千大千界湧出百億須彌盧諦觀雲海徹源委往古來今絕倫比盡底掀翻驗作家眨上眉毛隔千里上人索我雲海歌我歌雲海可奈何未開口時聲浩浩龍門鼓起滔天波荊石歌荊山有石徒落落何人知是無瑕璞卞和一見喜且驚持獻金門試雕琢楚國良工希復希可憐抱石荊山歸一朝剖決遇明主天生至寶真絕奇近聞荊山尚多石於中豈有連城璧牧童棄置同瓦礫時無卞氏誰能識舉世學道人各懷無價珍宗匠久不作未免成埋塵塵埋不埋何得失利物應機終有日願言此去善護持休向中途生退屈道人索我荊石歌載歌載歎可奈何荊石懷歸莫輕售世間自古讒言多禪悅吟我吟禪悅誰證據自有知音知樂處袈裟輕卷出塵來楖𣗖高擔入山去青松下碧巖前閑看浮雲橫曉天日輪初升照絕頂大地須臾俱洞然石門菴荒草路要行即行住即住有時兀坐破柴床困則和衣伸脚睡貧道人沒疎親頭頭應用皆天真山鳥銜花忽相過定回不覺人間春諸境空萬緣絕薝蔔吹香滿寥泬楞伽讀罷默無言舉頭遙望天邊月秋葉落秋風凉小溪流水聲自長薄暮驚逢採樵客擬尋歸路何徬徨獨噓嘻常慶快截斷千妖并百怪窮冬積雪遍山林絕勝普賢銀世界描不就畵不成悟得無生無不生一鉢持來香積飯淨名不出毗耶城禪悅吟吟不徹本色衲僧機用別全放全收正此時寄語通人好甄別
