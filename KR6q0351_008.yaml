body:
  text: 門人道哲等編詩五言八句追和歸源老祖山謳四首卜居傍深雲心心自知足蘿窗白晝長間把禪經讀荒徑無人蹤充飢多野蔌門外春草青忘機有麋鹿庭樹有佳色珍禽多好音渾然一片境了無差別心間來常獨坐詩成還自吟窅窅松門路迢迢白雲深山中住庵人本是方外客秋風一旦高草衣寒索索靜聽流泉聲坐看松子落何來牧牛童袒膊露雙腳長林悉凋落刮地霜風吹道人不出山終年無所知一心既空寂萬法將焉依海門明月上冷照枯松枝贈珉藏主見道能修道知恩合報恩大功原不宰妙斫了無痕剎剎神通藏塵塵智照門機先開活眼一句定乾坤贈李古銘居士在家能學佛齋戒誓終身欲證無為果須除有漏因頭頭全妙用一一契天真雖處塵勞界堪稱解脫人示顧妙心道人大道無方所頭頭總現成妄情才頓息覺性自圓明古鏡重磨瑩真金百煉精請看靈照女千載振嘉聲送密禪人潛行并密用要與古人同理寂事俱寂心空法亦空探玄須具眼覓佛謾施功的的吾宗旨堂堂日用中送天禧黁知客教觀與禪宗繇來絶異同心心無取捨法法自融通實相原非相真空亦不空玻璃輕托出特地顯家風示葉居士在家學佛人古今知幾幾悟得本來心何須棄妻子湘西龐道原河東裴公美機語播禪林芳名載僧史示翁居士本性天真佛堂堂日用中已勤修道志當進坐禪功觸處無妨礙臨機有變通心空能及第應與老龐同雲居十首雲居絶頂久矣荒蕪余領住持志圖興復於是躬操畚插首創室廬以居焉然時事艱難立功未就林泉勝絶藏拙是宜觸目寓懷遂成十偈示左右云絶頂雲深處膺公舊隱基自從經劫燒便覺值時危草沒隈岩塔藤纏臥路開荒當聖代禪誦樂無為絶頂雲深處生涯孰與論牽蘿難補屋夾樹易成門案潤塵偏積爐寒火尚存一聲山鸐唳不覺又黃昏絶頂雲深處吾今誓卜居草萊鋤不盡薇蕨食無餘古砌崩頽久虗堂結構初廢興應有數天意竟何如絶頂雲深處諸峰列作屏風林春淅淅煙樹曉冥冥鈍钁重安柄長鎌始發硎已成歸隱計築圃傍柴扃絶頂雲深處何人伴寂寥青山如可厭白日也難消採藥登岩洞看松倚石橋自慚樗散質無補聖明朝絶頂雲深處安居愜素心紅塵飛不到緑樹自成陰好鳥鳴當戶異花開滿林客從方外至曳杖碧溪潯絶頂雲深處憑誰話此宗獨芟階下草間撫石邊松寒暑三條衲乾坤七尺笻上堂藜糝熟童子恰鳴鐘絶頂雲深處禪房靜更幽猿啼清夜月鴈過碧天秋霜果香堪摘寒杉翠欲流從來人迹少何用息交遊絶頂雲深處長年事若何一心無住著萬念盡消磨自喜逢迎少誰言寂寞多充飢有黃獨那復下煙蘿絶頂雲深處丹青寫不成溪光晴轉好泉溜夜偏清但得山中趣寧圖世上名小窗寒月白梅影一枝橫讚觀音啓圓通門現比丘相妙應無方真慈無量全身墮在草窠中獨有善財能近傍手持如意輪仰觀天上月圓通門大開三世一切説魚籃觀音錦鱗鮮活出潮新赤手提來走市塵貴賤隨時無定價相逢不是當行人布袋和尚布袋橫拖走市廛逢人要覓一文錢只知追逐小兒戲忘却上方兜率天朝陽補破衲切切用針錐工夫要綿密這回補不完孤負天邊日對月了殘經手中一卷經天上一輪月了了在目前明明向誰説應供羅漢一隊垛根漢長年何所為神通雖變現佛法欠傳持我欲生按過未免費針錐捏怪有時盡誰能説得伊久向天台靜打隈有何忙事出山來只知度海邏齋去不覺從前滿面埃跨牛羅漢手持經卷跨犀牛知是何來老比丘便恁麼隨芳草去還家只合早回頭達磨祖師當門齒缺兩眉粗個是單傳碧眼胡出語不教天子契渡江空費一莖蘆六代祖師遠來東土為初祖教外何曾有別傳冷坐九年無折合獨携隻履返西天覔心不得安心竟鼻孔無端失半邊三拜起來依位立少林衣鉢是渠傳皖公山裏獨潛光聲迹都盧與世忘勾引沙彌來問法始終猶是不相當三度固辭天子詔一生只合住山中如何却有間情緒直上牛頭接懶融只個周家七歲兒從前揑怪更誰知解言有姓非常姓腦後分明欠一錐菩提非樹鏡非臺開口那知是禍胎傳得衣盂將底用三更月下離黃梅懶瓚禪師布衣穿結𩬆毛斑天子呼他不下山惹得虗名垂後世只因分芋俗人餐虎丘老祖睡虎耽耽世所誇堆雲觸著是冤家祇應肉醉空山裏更不人前露爪牙三笑圖天子呼他不出山送人却過虎溪灣信知陶陸非常士千載風流一笑間高峯和尚天目山中立死關話頭從此落人間青松樹下磐陀石凜凜高風孰可攀中峰和尚幻住菴居老作家頂門眼正辨龍蛇看他開口為人處嚼碎虗空不吐柦千岩和尚伏龍山上無明叟曾向獅岩落賺來死欵活供猶傑斗至今平地起風雷太宗和尚普慶振長老請早歷諸方門曾不循途轍豎起硬脊梁一條生鐵橛洎到紫籜峰平地遭一攧打失雙眼睛冤屈憑誰雪鴈宕掃寒雲龍囦弄明月兩處立牢關機用與人別威風凜凜振叢林師子教兒迷子訣古鼎和尚太平慧長老請披忍辱鎧豎精進幢三關不立群魔自降德尊位重理勝言龐晚居徑塢名聞異揭示妙明心地印倒流東海入西江止菴和尚半身一提鈯斧六坐覺場道傳正續名動諸方駕慈航暫遊笠澤懸慧日久駐錢塘龍淵之龍奮迅鳳臺之鳳翱翔既攄誠而闡大教益垂手以整頽綱全身雖不露遍界莫能藏百千三昧毫端現四海藂林話轉長松隱和尚即唯菴也松筠標格玉雪精神德尊緇衲名重縉紳大用全彰也澄潭印月真機普應也枯木回春等慈及物隨處接人獅子岩前拋鐵網華亭江上捉麒麟覺源和尚神機落落慧辨滔滔氣吞佛祖目視雲霄振化風於千里馳聲譽於兩朝傳持不謬舉措堪褒使王福中頂禮而心服亦猶馬師之於龐老藥山之於李翱嗚呼芥室之門賴有此老則西丘法道未甚寂寥也自讚面冷於鐵心死若灰無禪可説有口慵開奉天殿前應召曾坐凌霄峰頂承旨即來跛跛挈挈癡癡呆呆殃害叢林個瞎禿老拳要築禪人腮龍潭住長老請本是浙東僧來作江西客開口要罵人到處難著腳破沙盆不解提持鐵餕餡徒勞咬嚼獨坐歐峯巔門庭何冷落龜毛網布百千重擬打天邊金鸑鷟同安粲長老請頭如木杓眼似銅鈴少得人愛多得人憎禪不參剛要舉話字不識也解看經截斷松源之正續撲滅芥室之真燈為人無準的住院沒規繩千峰頂上恣騰騰萬里乾坤一衲僧童嶺德長老請德無可稱才不足取大坐猊床橫揮麈尾形模似箇師僧説話沒些義理掣風掣顛瞥嗔瞥喜拈生苕菷掃開歐阜之雲提破沙盆舀盡龍淵之水知之者謂其本分有餘不知者謂其脫空無比或西或東乍被乍此腳踏金船海月高鄱陽湖上清風起天龍善長老請平生要説拍盲禪掘地如何覓得天三處住山貧徹骨了無衣鉢與人傳乘藏主請承恩金闕奉天威五髻峯頭唱祖機老去貧無錐可卓摩挲兩眼看雲飛跋跋無準和尚詩正續老人傳宗説法之暇以詩辭翰墨為遊戲三昧故其片言隻字流落人間得之者不啻隋珠卞璧今善世托侍者寶此真迹出以示余請著語于後因謂之曰話到夜闌山月吐又騎白鹿入深雲切忌便作詩會汝為直下子孫要見此老用處更須高著眼始得跋中峰和尚墨迹幻住老人法性寬波瀾闊肆口而説信筆而書莫非揭示生佛已前一段奇特大事今觀所與阿塔輪夫人法語以無礙辨才發明法華奧旨可謂穿過釋迦老子鼻孔雖然若約衲僧門下猶欠勦絶在悟藏主寶此遺墨且道豫作是説畢竟意在於何吳門兜率園比丘明聞閲塔銘有序皇明紀元永樂之元年十月草有三日癸酉我徑山第六十代住持呆菴莊禪師示疾卒于不動軒之正寢世壽五十八僧臘四十五其徒曇頓等能遵治命自殮殯以至於茶毗窀穸中禮無違越明年豫繼領寺事視篆之初觀其遺規井井寺衆雍雍凡所作為皆有條而不紊東西列序各職其職顧豫衰耄承乏居位率由舊章蕭規曹隨克守唯謹既而頓以師塔未銘狀其行實請豫銘之豫義不可辭乃按狀掇其大槩而直書之禪師諱普莊字敬中呆菴則其別號也族系台仙居之袁氏世襲儒業母王氏誕師之夕夢梵僧入室以元至正七年丙戌八月十二日生晬歲岐嶷頴異不類常兒善本夙習厭絶葷茹甫八歲負笈入鄉校授以詩書經耳成誦恆愛靜獨兀若有思如寱自訟曰讀書明理處世法也學出世法固所願焉年十二白父母求出家父母雖珍愛之終莫能奪其志會族之叔父有從釋者來歸遂携至鄞左菴良禪師居天童法席甚旺見而録之明年己亥剃髮受具服勞參侍久之不契辭抵郡城之天寧時了堂一和尚提破沙盆話勘辨來機師徑趨丈室堂曰何來對曰天童堂曰冒雨衝寒著甚死急對曰正為生死事急堂曰如何是生死事師以坐具作摵勢堂曰敢這裏捋虎鬚參堂去一日堂室中舉庭前柏樹子話師擬開口堂劈口掌之豁然有省遂容入室朝夕決擇爰臻閫奧未幾歸候左菴菴察其機警異常命典藏鑰無何而堂移幢天童師喜形聲色執勤愈謹洪武丁巳有旨命天下僧徒講習心經楞伽金剛三經性原禪師明公住持鎮江金山延師講授啓發學徒剖釋經義深契機理聽衆厭服聲價藉甚明年戊午客寓天界全室滿菴二大老位望尊重師與抗衡論辨機緣窮徹底蘊歎賞無已以為親得暮翁骨髓臨濟正宗良有託矣又明年己未起師出世撫州北禪開堂之日酬恩瓣香爇為了堂推拂之下發蔀振蒙緇白傾向慨惟古寺屋老僧殘急於事功興舉廢墜殿堂像設廊廡鐘魚構治塗飾百凡維新遷主雲居先是寺廢既久名存實亡師領薦之日誓於舊址縛茅聚衆興復是圖全室叟聞而壯之曰真本色住山人也居僅五載募施經營奔走衆工寺宇落就鯨鼉震吼金碧翬飛大闡玄機江右獨步二十六年癸酉之春詔徵天下高行沙門師與舉首對揚稱旨允愜皇情是年秋函命至廬山祭祀立感格聖靈騰光現瑞神燈映射祥靄氤氳壇下上蕩眩萬目陪祀官僚僧道士庶稽顙歸依同聲讚歎禮成復命喜動堯眉賜衣一襲褒錫甚隆是冬得旨升住徑山寺為海內禪宗首剎俾師居之所以致崇極於師道也師既戾止培植教基弘道本繼前烈之光焰級後進之階梯殿壁湧海巖之觀音樓鐘範鳧氏之巨器創菴中峯見祖燈之有續散田原佃免官租之徵追摩衲綵袱之賜道懷親王解帶留衣之機交傾名宦三宗讓德四衆宅心位尊一代龍謂備至耳矣於戲教阽叔運道輟宗工遺言溘爾順寂七日闍維煙𦦨所至設利燁煜數珠出灰燼壞遺骨塔于寺霄之陽門徒弟子竣相向悽楚有言于衆曰師入大定吾徒載瞻載慕惟此塔婆而已首度弟子若干人得法弟子若干人其説法三會語録若干卷並傳焉然不銘石以表之其何以昭示永久於是請銘銘曰巍乎天台上應列宿磅礴扶輿鍾奇𭯉秀篤生偉人禪林領袖翊世扶民家陰佑了堂恕中同出台岫難弟難兄更唱迭奏元季宗工道德實茂維呆菴師幼而騫鴝師資稔緣遇于古鄮太白天寧心法密授匡徒西江時緣輻凄所至成績宏規復舊律己峭嚴訓徒善誘聲譽日隆海內馳驟詔徵高僧褎然舉首對揚契機寵錫斯厚命居徑山如登靈鷲法雨沛滂霑溉羣有忽覩白晝化權既仆雙徑峰嘷猿躑狖一木詎於戲哲人銘石堂隅
