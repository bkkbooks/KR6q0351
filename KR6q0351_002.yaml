body:
  text: 門人智等編徑山語録師於洪武二十六年十一月十三日入寺指山門云我此法門天寬地闊汝等諸人於中出入須知有向上關棙子始得喝一喝佛殿燒香云三世諸佛即今向香煙起處放光現瑞轉大法輪狸奴白牯呵呵大笑露柱燈籠呵呵大笑據室拈拄杖云明頭來明頭合暗頭來暗頭合道得也二十拄杖道不得也二十拄杖何故重賞之下必有勇夫卓拄杖拈劄這一句子盡大地人受用不盡老僧今日感恩有分指座從上先德推此一位以為極則莊上座見得只是尋常遂升座拈香祝聖罷斂衣就座僧問九重天上承恩澤五髻峰頭據祖關四海禪流齊側耳願聞一曲萬年歡學人上來請師舉唱師云須彌頂上擊金鐘進云與麼則過量人明過量事太平時唱太平歌師云毫釐有差天地懸隔進云和尚遠辭京國近到徑山如何是不動尊師云待盂峰𨁝跳即向汝道進云適聞疏中有語千年枯木逢春一代曇華現瑞可謂誠實之言師云汝用許多心識計較作麼進云龍象筵開當此日等間掣取錦標歸師云不是龍門客切忌遭點額乃云山僧道慚先哲迹混叢林任運度時貴圖藏拙何期京師宿德謬採虗聲俾預高僧之選叨蒙聖主之恩召對禁庭親承睿獎法衣特賜光揚少室宗風寵命載頒來主國一祖席教中所謂我本無心希求今此法王大寶自然而至當此之時下情惟知欣感而已若曰闡揚佛法報答皇恩且佛法如何闡揚皇恩如何報答到者裏也要諸人共相知委擊拂子萬派千溪皆渤澥七金五嶽盡須彌復説偈曰親奉綸音出禁圍凌霄峰頂唱玄機報恩一句能相委選佛場中及第歸冬至日上堂魯公臺上書雲是世法不是佛法慈明堂前揭榜是佛法不是世法徑山門下佛法世法拈放一邊施主今日辦供堂中大有胡餅一任諸人橫咬竪咬上堂逢佛殺佛逢祖殺祖橫按鏌鎁拋沙撒土敢問諸人既是橫按鏌鎁因甚拋沙撒土莫是徑山老漢説禪全無本據麼掇轉南辰向北看天上日輪正卓午師因僧請益次師云汝自己分上少箇什麼却來請益僧擬對師云只知貪程不覺蹉路佛成道上堂舉世尊於正覺山前夜覩明星成無上道嘆云奇哉一切衆生具有如來智慧德相只為妄想執著而不證得師云我要問釋迦老子喚什麼作智慧德相喚什麼作妄想執著擬議不來劈脊便棓衆中還有與釋迦老子出氣者麼拈拄杖不敢望汝與釋迦老子出氣只是自己鼻孔摸索得著也好靠拄杖上堂徑山今日無可管待來賓未免將佛祖骨髓和盤托出以當藥石只恐諸人向諸方築著一肚皮殘羮餿飯遇斯藥石吞又吞不下吐又吐不出返使旁觀一場笑具正與麼時且道誰是旁觀者回顧侍者云幾乎錯下注腳便下座元旦上堂老僧未開口已前一切時一切處普光心印文彩全彰待汝著眼來早是塗糊了也今朝特為點出普請諸人證據驀拈拄杖卓一下云新年把筆萬事大吉靠拄杖下座師問僧云盡十方世界是毗盧正印你道印紐落在什麼人手裏僧擬議師厲聲云且去別時來上堂舉古德云有一人常在途中不離家舍有一人離家舍不在途中且道那一人合受人天供養師云離家舍不離家舍在途中不在途中即不論徑山道盡大地止有一人合受人天供養諸人還識那一人麼擊拂子莫教開却眼子過新羅上堂三世諸佛也與麼六代祖師也與麼天下老和尚也只與麼獨有徑山却不與麼你道與麼不與麼還有優劣也無拈拄杖畫一畫云一二三四五六七七六五四三二一昨夜三更月到窗文殊坐對維摩詰便下座藥監寺火應病與藥據欵結按金剛圈栗棘蓬透不過吞不下總是死漢山前猛虎趂於菟火裏蝍蟟吞鱉鼻上堂舉盤山和尚云心月孤圓光吞萬像光非照境境亦非存光境俱忘復是何物洞山和尚云光境未忘復是何物師云二尊宿弄物不知名各與二十拄杖不見道見義不為何勇之有芥室和尚忌拈香云巴陵三轉語太殺誇張楊岐女人拜徒勞賣弄徑山今日爇此枯木不是供養先師只要天下衲僧知有些子氣息遂插香召大衆云且道是甚氣息衆無語師哭云蒼天蒼天上堂顛倒想滅生死路絶生死路絶涅槃界空洞山五位臨濟三玄擬向甚處安著朝悠悠暮悠悠欲窮千里目更上一層樓拍禪床下座上堂古人説不到處今人説得到今人行不到處古人行得到要知行不到處便是説不到處要知説得到處便是行得到處古人今人鼻孔總在徑山拄杖頭上諸方老宿作麼拈掇現前大衆作麼拈掇拈拄杖卓一下便下座冬至上堂舉洞山冬夜與泰首座喫果子次問云有一物明如日黑如漆常在動用中動用中收不得過在甚麼處座云過在動用中洞山令侍者掇退果卓泰首座不得果子吃師拈云當斷不斷反招其亂若是徑山見他道過在甚麼處便與掀翻果卓亦使洞山知有宗門向上爪牙今日兒孫不致寂寥雖然也須腳踏實地始得拈拄杖不向藍田射石虎何人知是李將軍卓拄杖下座上堂祖師心印狀似鐵牛之機搆得搆不得即不問你道祖師開口舌頭落在甚麼處擊拂子不是一番寒徹骨爭得梅花撲鼻香上堂舉古德因僧問如何是新年頭佛法古德云春來草自青師云古德與麼答話雖赴來機要且未能脫灑今日忽有人問徑山如何是新年頭佛法即向他道八荒開壽域一氣轉洪鈞三十年後一任天下衲僧胡卜亂卜上堂妙用全彰無在不在通身是眼覷不能及通身是口説不能到汝等諸人聞與麼道將謂有多少奇特殊不知賤如糞土輕似毫毛便下座佛涅槃上堂舉世尊於涅槃會上以手摩胸告衆云汝等善觀吾紫磨金色之身瞻仰取足勿令後悔若謂吾滅度非吾弟子若謂吾不滅度亦非吾弟子時百萬億衆悉皆契悟師云瞿曇末上一場敗闕百萬億衆中更無一人有衲僧氣息諸人還見世尊以手摩胸麼水向石邊流出冷風從花裏過來香上堂良久云自有生佛以來説法如雲如雨者不可勝紀徑山今日權借虗空為口須彌為舌宣説真俗不二法門十方世界情與無情一時異口同聲讚言善哉善哉希有希有衆中莫有旁不甘的麼出來與拄杖子相見拈拄杖卓一下云諦觀法王法法王法如是便下座上堂大道只在目前要且目前難覩欲識大道真體不離聲色言語豎拂子云志公和尚即今在徑山拂子頭上打筋斗供養諸人昔所未見者看看南天台北五臺走得遍還到來喝一喝下座佛誕上堂瞿曇降誕是斯辰啜賺古今多少人恨殺雲門棒頭短虗空迸作一條痕上堂豎拂子云十方諸佛在拂子頭上異口同音宣説安居法門云九旬無虗棄之功百劫即今時之用撞著十字街頭廖胡子揚聲唱言恁麼説話面皮厚多少好點一把火照看諸佛世尊一時懡㦬而散汝等沙門釋子作麼生與諸佛出氣擊拂子云徒將不平事説與負心人上堂僧問如何是宗門向上第一句師云我若向你説即是第二句進云二六時中如何用心師云無你用心處乃云大光明藏無幽不燭一槌打碎孰辨端倪赤梢鯉魚跳入龍門南山起雲北山下雨諸人濕却袈裟角還知麼喝一喝下座上堂解夏止有一月日在剋期取證事作麼生衆中忽有箇漢出來道長長年儱侗月老僧拽拄杖趂出然則膏肓之門難以發藥布袋裏盛錐子不出頭是好手喝一喝下座上堂諸禪德解制之後東去西去南去北去忽然三家村裏撞著個風顛漢問云上座自徑山來只如開山和尚有言山上有鯉魚井底有蓬塵畢竟意作麼生須是方便答他始得不可向伊舉古舉今説事説理不可拂袖便行驀面便吐設若答他不契被他叱云徑山飽柴飽水輸與上座受用若是佛法未夢見在纍及老僧也是箇無孔鐵槌擊拂子云一等共行山下路眼頭各自看風煙上堂子胡喝僧看狗趙州喚僧喫茶冷地看來慚惶殺人老僧不曾辜負諸人諸人不得辜負老僧因事上堂嗟末法惡時世衆生薄福難調制去聖遠兮邪見深魔強法弱多冤害聞説如來頓教門恨不滅除令瓦碎古人一期説話誰知驗在今日雖然從他謗任他非把火燒天徒自疲我聞恰似飲甘露消融頓入不思議且道是什麼人分上事拈拄杖敲香几云永嘉大師來也卓拄杖上士一決一切了中下多聞多不信上堂僧問如何是祖師西來意師云盂口向天進云此是古人語𠰚師云老僧用得恰好進云如何是奇特事師云千年田八百主進云學人不會師云至今將不去留與老農耕僧禮拜師乃云善能分別諸法相於第一義而不動菩提涅槃真如解脫盡是法相喚什麼作第一義有者背地裏商量便道常在心目之間逈出思議之表殊不知金屑雖貴落眼成翳要明第一義猶隔海在擊拂子云海枯終見底人死不知心祖忌拈香梁王殿上將金博金少室峰前以楔出楔蔥嶺那邊逢宋雲誰知弄巧翻成拙上堂群陰剝盡一陽生萬國歡呼賀太平日出三竿天四霽五雲獨繞九重城履首座入塔真實履踐的人出生入死如同遊戲且眉間挂劒時如何擬議不來髑髏著地上堂舉真淨和尚上堂云衲僧門下無非過量境界自在禪定乃喝一喝云豈不是過量境界又謦咳一聲云豈不是自在禪定阿呵呵將此深心奉塵剎是則名為報佛恩師云顯示過量境界自在禪定還他真淨老人若是衲僧門下猶欠悟在徑山則不然拈拄杖卓一下云得之於心事事無礙應之於手法法圓成靠拄杖他家自有通霄路不向如來行處行上堂一迷一切迷一悟一切悟一暗一切暗一明一切明所以具足凡夫法凡夫不知具足聖人法聖人不會聖人若會即是凡夫凡夫若知即是聖人到這裏塵勞煩惱菩提解脫縛作一塊且道非非想天即今有幾人修因證果拈拄杖云一年三百六十日一日日從今日始拄杖子亦從今日始卓拄杖擊碎三玄三要門普天匝地清風起上堂衲僧門下貴圖直截如何是佛殿裏底如何是道墻外底此是趙州和尚直截為人處然則徑山直截處也要諸人共知喝一喝下座上堂盡大地是光明藏盡大地是解脫門盡大地是金剛寶座盡大地是毗盧正體汝等諸人同一心知同一眼見因甚緇素不出不得自在受用徑山今日一一拋向諸人面前普請證據良久云楊岐驢子𨁝跳觸碎雲峰桶篐不是龍門上客莫來倒捋虎鬚擊拂子下座師問僧云汝破夏來見老僧著甚來由僧云生死事大師云山上與山下同一天地因甚炎涼不同僧云和尚自生分別師以坐具摵之云他時異日也道見徑山來僧發憤趨出師喚云上座僧回首師云生死事大那僧禮拜上堂人從廬嶽來接得華頂信報道南山白額虎却在龍淵裏藏牙伏爪東海赤梢鯉直上鷲峰頭躍浪衝波好大衆一大藏教何曾説到這裏雖然徑山拄杖子未肯放過在拈拄杖畫一畫云仙人張古老不受藥葫蘆靠拄杖下座上堂破有法王出現世間隨衆生欲種種説法釋迦老子四楞塌地了也還有扶得起者麼唯此一事實餘二則非真忽若睦州和尚道三九二十七菩提涅槃真如解脫有什麼過擊拂子下座元旦上堂新年頭不可與諸人葛藤德山棒臨濟喝拈放一邊你道趙州和尚使得十二時辰還有勘驗處也無擊拂子家家門前赫日月太平不用將軍威上堂鳥窠吹起布毛通侍者便解悟去如蟲禦木偶爾成文雲門揚下柴爿一大藏教只這是為蛇畫足取笑旁觀徑山與麼批判譬如獅子王哮吼諸獅子兒聞之悉增勇健若是野干之流自懷狂怖又爭怪得喝一喝下座上堂最初一機末後一句耀古騰今撑天拄地明眼衲僧無摸索處覿面當機一槌粉碎這箇説話惟悟者方知若是無智人前未免翻成戲論驀拈拄杖卓一下云青山不鎖長飛勢滄海合知來處高上堂今朝五月初一箇事為君指出階下流水潺湲門外新篁蓊非惟歷歷明明抑且綿綿密密老僧更無傳持大衆何有得失回顧侍者云忽若有個無面目漢到來相看只向他道不必不必便下座解夏上堂諸法從本來常自寂滅相若無諸佛住持首楞嚴定衆生隨順無明業識然迷悟在人而不在法徑山一夏與諸人同出同入要且不離一相三昧今當自恣之辰西天蠟人氷東土鐵彈子即不問拈拄杖云拄杖子穿過釋迦老子鼻孔因甚諸人罔知痛覺靠拄杖云大海若無山隔斷天光直與水相連上堂玄沙因鼓山至畫一圓相山云人人出這箇不得沙云誠知你向驢胎馬腹作活計山云和尚又作麼生沙云人人出這個不得山云和尚為什麼道得某甲道不得沙云我得你不得師云玄沙與鼓山難兄亦難弟若要出得這個總欠悟在雪竇云只知貪觀白浪不知失却手橈師云緇素眼何在驀拈拄杖畫一畫云一把柳絲收不得和煙搭在玉闌干上堂明明向汝道開口不在舌頭上擊石火閃電光搆得搆不得未免喪身失命若自伶俐漢聞與麼道自然別有出身之句有麼有麼擊拂子不是龍門客切忌遭點額上堂釋迦掩室於摩竭提國淨名杜口於毗耶離城是皆靈龜曳尾拂迹迹生太陽溢目萬里不挂片雲爭奈覆盆之下漆黑黑地四來禪侶同此坐夏既無兩錯商量亦無正因可説蒲團靜倚無餘事永日寥寥謝太平上堂心心不昧法法無差金剛與泥人揩背即不問且道鴟吻咬却佛殿脊還有勘驗處也無昨夜三更失却牛天明起來捉得賊賊賊便下座上堂布袋頭解開了十方世界蕩蕩無邊衲僧家緊峭草鞋橫擔拄杖東西南北去住自由不妨慶快忽若撞著杜撰巡官問道上座如何是行腳事也須好好祗對他始得驀拈拄杖卓一下云不向藍田射石虎何人知是李將軍璣藏主火辨傾河漢文綴珠璣生死岸頭總用不著一大藏教是箇之字祖師西來是箇右字提起火云勝熱門頭參得透丙丁童子念摩訶上堂八月秋何處熱岩桂吹香滿寥泬風景凄清泉聲幽咽祖意明明誰辨別大藏小藏橫説竪説不出如今箇時節同不同別不別堪悲堪笑老寒山剛道吾心似秋月拍禪床下座上堂我宗無語句亦無一法與人達磨大師從南天笁國來我東震旦土唯傳心印接上乘人大是可笑笑須三十年衆中忽有個漢出來道徑山與麼道也好笑三十年老僧下禪床與伊握手共笑當是之時也無佛也無祖也無禪也無道也無人也無我豈不快哉拈拄杖有麼有麼卓拄杖囉囉招囉囉搖囉囉送莫怪空疏伏惟珍重上堂前念昏迷是病後念覺悟是藥直教脫體風流藥病盡情拈却所以道一大藏教盡是療狂子之方都無實義只如文殊舉起玻璃盞問無著云南方還有者個也無畢竟是何道理拈拄杖畫一畫云上大人丘乙己化三千七十士可知禮也浴佛上堂舉藥山因遵布衲作殿主浴佛次乃問云汝只浴得這個還浴得那個麼遵云把將那個來山休去師云藥山能縱不能奪遵布衲能奪不能縱總未具超宗眼在黃龍南禪師云二尊宿一出一入未見輸贏三十年後不得錯舉早是錯下名言徑山見處也要諸人共知今日殿中普請浴佛這個那個不得動著杓柄到手更莫顢頇擊拂子將此深心奉塵剎是則名為報佛恩上堂舉雲門大師因僧問如何是和尚家風答云門外讀書人報來師頌云問著和尚家風開口便成話墮門外讀書人來未免之乎者也上堂諸方説禪説道舉古舉今龍象駢闐法筵隆盛徑山這裏一味據欵結案有人渾身錦繡入來直教他寸絲不挂而去有人不挂寸絲入來直教他渾身錦繡而去衆中忽有個漢出來道總不與麼來時如何二十棒一棒也不放過大衆且道此棒是賞伊罰伊拈拄杖云他時異日逢人不得錯舉卓拄杖下座上堂前半夏過去已過去後半夏未來猶未來即今中夏現在空寂過去心不可得未來心不可得現在心不可得即心即佛非心非佛不是心不是佛不是物三腳驢子弄蹄行頂門放出遼天鶻上堂舉五祖演和尚因諸寺長老入山上堂云臨濟入門便喝是甚麼熱碗鳴聲德山入門便棒拗曲作直雲門三句洞山五位大開眼了作夢何故如此國清才子貴家富小兒嬌師云五祖老人大似將常住物作自己人情徑山見處也要諸人共知乃豎起拂子云德山臨濟洞山雲門只今在拂子頭上各説不二法門了一時走入淨瓶裏澡浴去也何故如此水流元在海月落不離天上堂舉雲門和尚因僧問樹凋葉落時如何門云體露金風師云這僧置箇問頭不妨親切只如雲門與麼答還有為人處也無徑山則不然忽有人與麼問但向伊道不因夜來鴈爭見海門秋拈拄杖畫一畫下座
