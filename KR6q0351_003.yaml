body:
  text: 門人智編輯小參雲居入寺當晚小參靈光不昧萬古徽猷智鑑洞明十虗普應所以法隨法行法幢隨處建立有時十字街頭拋沙撒土有時千峰影裏嘯月披雲卷舒在我縱奪臨機譬如洪鐘在大扣大鳴小扣小鳴明鏡當臺胡來胡現漢來漢現了無今古之分亦無去來之相把住則乾坤失色放行則瓦礫生光正與麼時且道把住則是放行則是良久云龍袖拂開全體現象王行處絶狐踪復說偈云我本江湖落魄人年來隨處著渾身業風吹到雲居寺贏得相依安樂神夜參山深寒重各自知時豈可繁詞久勞衆聽歸向堂中燒榾柮不妨天曉候雞鳴結夏小參一心不生萬法無咎汝等諸人發志參禪早是不著便何況聽他繩床上老宿說玄說妙舉古舉今以當宗乘遠之遠矣即今要與本地相應直須從前放下百不知百不會向生佛已前著一隻眼看是個什麼忽然拶破虗空便見十方世界盡是圓覺伽藍何處更有山河大地來山僧與麼道也是作死馬醫若是超宗越格底衲僧著著自有出身之路拈拄杖衆中還有超宗越格底衲僧麼卓拄杖泥牛昨夜遭塗炭直至如今不見蹤除夜小參僧問如何是雲居境師云路轉溪回空院靜僧云如何是境中人師云太平時代自由身僧云人境已蒙師指示願聞一句接初機師云無毛子貼天飛乃云我此深山絶頂今夜歲盡年窮無可與諸人分歲更不學他北禪烹露地白牛只將東山老祖鐵餕餡供養諸人若也咬嚼得破自然一飽能消萬劫飢直饒諸方百味珍羞吃了便須吐却何故醍醐上味為世所珍遇斯等人翻成毒藥驀拈拄杖卓一下云巴歌合出陽春調脫體風流出當家復說偈曰烏兔循環歲又除普光心印只如斯相逢總是英靈漢不向當頭捋虎鬚解夏小參僧問路逢達道人不將語默對時如何師云達道者方知僧云和尚何得干戈相待師云捉賊不如嚯賊僧云明眼人瞞他一點也不得師云情知你不是好心乃云諸禪德光陰易過佛法難逢才看夏日炎炎又見秋風拂拂古人立三期限令汝取證汝試審思看九十日內成得箇甚麼事經云踞菩薩乘修寂滅行且菩薩乘作麼生踞寂滅行又如何修若能一念知非全體顯現一切煩惱畢竟清淨法界海慧照了諸相猶如虗空其或未然切忌以思惟心測度如來圓覺境界拈拄杖云拄杖子穿過釋迦老子鼻孔阿修羅王忍俊不禁直上三十三天與釋提桓因鬪戰汝等諸人還聞鑼鼓聲麼以拄杖卓一下云且莫瞌睡當晚小參佛祖方便數如河沙撿點將來皆為剩語饒汝門庭施設機辨縱橫未出意根徒自欺誑決欲究明千聖向上一著直須截斷塵緣豁開己眼頭頭上具物物上明自然常光現前壁立萬仞盡十方世界是涅槃妙心更覓一法如微塵許有生滅相了不可得諸上座還委悉麼百尺竿頭笑轉身却來堂中疊足坐復舉當山國一祖師因馬祖遣僧來問十二時中以何為境祖云待汝回去時有信僧云即今便回去祖云傳語却須問取曹溪師拈云馬祖大似埋兵掉鬪國一可謂遇變出奇者僧雖善通使命要且勞而無功驀拈拄杖畫一畫云三汲浪高魚化龍癡人猶戽夜塘水除夜小參年窮歲盡地凍天寒現前禪侶圍繞繩床擬聽老僧處分個甚麼若說佛法佛法無說若論世法世法無論便爾休去將謂無折合只如大慧老人平昔以竹篦用事還曾打著一個知痛癢底衲僧麼密菴和尚將正法眼喚作破砂盆更是不識好惡徑山拄杖子今夜忍俊不禁出來與諸人決擇是非去也拈拄杖畫一畫云一氣不言含有像萬靈何處謝無私復舉僧問古德年窮歲盡時如何古德云東村王老夜燒錢師頌云東村王老夜燒錢管取新年勝舊年溪上石人相耳語鐵牛耕遍劫初田解夏小參絶頂寥寥亂山矗矗不離當處即是道場何假對揚方稱佛事更說什麼長期短期尅念攝念摩竭提國早涉繁辭毗耶離城翻成剩語只如溈山問仰山云子一夏作得箇什麼蝦為子屈仰山云鉏得一片畬種得一籮粟有甚共語處溈山云子一夏可謂不空過何不與伊本分草料仰山問溈山云和尚一夏作得箇什麼不妨賣峭溈山云日間一餐夜間一寢隨摟搜漢仰山云和尚一夏可謂不空過互相欺瞞今夜忽有人問徑山一夏作得個什麼只向他道步步踏著實地且道是空過不空過拈拄杖畫一畫云鶴有九臯難翥翼馬無千里謾追風除夜小參僧問如何是道師云木落崖石出進云只如開山和尚云山上有鯉魚井底有蓬塵意作麼生師云見之不取思之千里僧禮拜師乃云徑山今夜分歲小小開箇家宴普請諸人隨分納些些楊岐栗棘蓬東山鐵餕餡早已和盤托出了也若是擘不開吞不下又爭怪得衆中忽有個漢出來道也只是家常茶飯老僧指出露地白牛向伊道你莫是庖丁手麼擬議不來劈脊便打何故禁令既嚴不許攙行奪市復說偈曰浮世光陰自不多看看又是一年過夜參欲說無窮事奈此風頭峭硬何結制小參心如虗空界示等虗空法證得虗空時無是無非法從上佛祖莫不以此心法傳示將來作大佛事徑山只今以此心法為大伽藍十方法界若聖若凡同一安居平等性智驀拈拄杖卓一下云過去諸如來斯門以成就現在諸菩薩今各入圓明未來修學人當依如是住觀音菩薩將錢買胡餅放下手却是饅頭卓拄杖一下復舉趙州勘婆子話頌云臺山路上婆子勘破須他趙州我道全無巴鼻人言亦有來由解制小參古者道青青翠竹總是真如黃花無非般若空劫已前無佛無衆生真如般若從誰得名我此五髻峰頭千年古寺四來禪侶聚首安居九十日夏今以告圓空劫已前事即不問汝日用中間還與自己得相應也無良久適來有一人為蛇畫足輥入葛藤窠裡去也拈拄杖且聽拄杖子出來露箇消息卓拄杖云撒手似君無一物徒勞辛苦說千般復說偈云絶頂凉生夜氣清三期功滿不留情布單欲賣且休賣穩靠蒲團樂太平冬至小參寒來暑往陰極陽生二曜循環四時合節此造化無私之功實古今不易之論我等沙門釋子不知歲之餘閏不問月之大小喚作無事人則可喚作了事人則不可八萬四千法門一千七百公案須是一一參究一一透脫始得驀拈拄杖召大衆云傅大士即今在諸人鼻孔裏騎牛出入一個個眼眨眨地要且捉摸他不著卓拄杖陽氣發時無硬地庭前石笋有新條復舉僧問古德云冬至後日長多少古德云一線長又僧問古德云冬至後日長多少古德云長一線師頌云一線長長一線開口須知有方便東頭賣貴西頭賣賤靈利衲僧有眼不見見不見頭上金烏急如箭除夕小參萬緣寢息一性融通大用全彰神機獨露古佛與露柱交參燈籠與占波鬬額不是神通所現亦非法爾當然正與麼時廣澤龍王與陳如尊者耳語明日慶賀新年為復佛法相見世法相見大慧老人以黑漆竹篦打地一下云㘞你有許多撈攘一時走上善法堂前擬向天帝釋雪屈乃喝一喝云若不喝住未免雨似盆傾復舉北禪賢禪師除夜示衆云今夜無可與諸人分歲未免烹露地白牛燒榾柮火唱村田樂免致倚他門戶傍他墻剛被時人喚作郎下座歸方丈有僧隨後喚云和尚門外有公人來賢云作甚麼僧云道勾和尚納皮肉賢將暖帽擲與之僧接得跪進云天寒且還和尚帽子賢呵呵大笑師頌云分歲聊烹露地牛要輸皮肉任來勾大家唱起村田樂無可還他即便休解夏小參目前無法法外無心心法俱忘理事交徹上無攀仰下絶己躬頭頭顯示真機物物全彰妙用如我按指海印發光汝暫舉心塵勞先起釋迦老子滿面慚惶汝但外息諸緣內心無喘心如墻壁乃可入道達磨大師一場漏逗大抵叢林以小參為家教汝等諸人每日著衣喫飯有什麼過九旬夏滿不妨去住自由老僧住持事繁更不叨叨嘮嘮擊拂子知恩者少負恩者多復舉翠岩參禪師夏末示衆云一夏與兄弟東語西話看翠岩眉毛在麼師云一夏東語復西話翠岩方便苦無多眉毛打失渾間事爭免全身入草窠除夜小參我此法印在天同天在地同地言凡則全凡舉聖則全聖自古自今若幽若顯無有一法不在裏許所以得之於心千變萬化失之於旨萬別千差汝等諸人從年頭至年尾滿眼著大似不曾見滿耳聽來大似不曾聞何異飯籮裡坐甘受其餓大水裏浸甘受其渴徑山今夜不吝慈悲未免重為注破拈拄杖卓一下一年光景今宵盡萬里更無人未歸復說偈曰坐守空山歲又窮夜堂相聚話西東少林一曲無今古自是諸方調不同解夏小參教中云袈裟下得人身者如爪甲上土袈裟下失人身者如大地中土以是言之人身極不易得佛法實是難逢我輩沙門釋子那邊經冬這邊過夏要住即住要行即行幸無飢寒之迫亦無征役之勞當念寒暑迭遷死生交謝前路茫茫擬何憑仗於斯勤加精進早求出離庶幾報答佛恩免致埋沒自己若是伶俐衲僧聞與麼道出來向千聖頂𩕳露箇消息便見九旬無虗弃之功百劫即今時之用堪與佛祖為師合受人天供養其或未然莫將無事會無事困人心結夏小參大用現前不存軌則自非過量人難明過量事總無邊剎海向一毫端於一毫端而建伽藍促無量劫數為一念頃於一念頃是聖是凡普請禁足安居平等性智蝦蟇蚯蚓悉證圓通文殊普賢共相慶讚此蓋如實之理稱性之言若是義學之徒見不超色聽不出聲分彼分此說染說淨返謂我衲僧家脫空謾語又爭怪得拈拄杖畫一畫云情塵消盡見端的不歷僧祇獲法身復舉僧問洞山寒暑到來如何回避洞山云何不向無寒暑處去僧云如何是無寒暑處洞山云寒時寒殺闍黎熱時熱殺闍黎頌云覿面當機見洞山正偏回互不相關無寒暑處堪回避那取工夫到一翻結夏小參古佛堂前曾無異路祖師門下寧有多談然佛法不異人心自用無非祖意良由取捨妄見異同若能直下承當便可隨時受用根塵逈脫境智互融這邊那邊唯我自知正法像法該他不著若也分別名相馳騁知解以當本參何異者砂欲成嘉饌豈不見釋迦世尊於楞嚴會上語阿難云汝雖歷劫多聞不如一日修無漏學且無漏學作麼生修若謂有修有證正是誑謣閭閻若謂無說無聞未免顢頇佛性諸禪德到者裏須是如實體究從人決擇始得明日結制剋期取證九十日內莫作等閒時不待人各宜勉力擊拂子復舉德山和尚小參云今夜小參不答話問話者三十棒時有僧出德山便打僧云某甲話也未問因甚便打德山云汝是甚處人僧云新羅人山云未跨船舷好與三十棒師云者個公案諸方老宿凡遇小參未免批判一上然只能扶強不能扶弱徑山今夜要斷不平牙如劒樹口似磉盆還他德山老漢若是辨衲僧眼猶缺悟在這僧當時才出直云某甲今夜不問話只與和尚相見則個他若行棒便與接住一送非惟坐斷德山抑亦是個俊快衲僧拈拄杖卓一下鶴有九臯難翥翼馬無千里謾追風解夏小參菩提道果本自圓成不假修為豈從人得聖凡情盡體露真常頭頭上明物物上具如斯了達徹見根源打破生死牢關掀翻是非窠窟盡十方世界都盧是箇圓覺伽藍佛國魔宮隨緣遊戲淫坊酒肆任性安居了無染淨之分豈有去來之異此名正遍知海亦名大解脫門驀拈拄杖豎起云釋迦世尊圍繞恆河沙數諸佛只今在徑山拄杖頭上休夏自恣各各演說無量無邊微妙法藏汝等諸人不假兩眼還見麼不假兩耳還聞麼其或未見未聞切忌向虗空裏圖度靠拄杖羚羊掛角千峰上更有羚羊在上頭復舉洞山和尚示衆云秋初夏末東去西去直須向萬里無寸草處去僧下語多不契有僧傳至石霜霜云何不道出門便是草僧復傳此語至洞山山云瀏陽乃有古佛出世師頌云秋初夏末走西東拄杖頭邊活路通寸草不生千萬里出門一片碧茸茸
