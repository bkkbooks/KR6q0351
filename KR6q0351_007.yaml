body:
  text: 小師曇頓等編詩七言八句讀古林和尚語録三十餘年振祖風此菴門戶不雷同驗人眼在眉毛上陷虎機藏掌握中枯木抽條垂地緑冷灰發焰亘天紅看渠擘破渾侖句抹過楊岐栗棘蓬送仰山堅藏主尋師擇友為參禪須是身心鐵石堅千里瞻風終枉爾一朝嗄地始欣然雪消庾嶺春飛錫月滿鄱江夜泛船抉得驪珠光燦爛集雲峰頂浪滔天送敏侍者時在撫州北禪寺撥草瞻風不憚勞光陰多是等間拋當場正好施三頓平地須防吃一交黃競尋紅稻紫鸞偏向碧梧巢北禪有語非干舌紙襖毋煩侍者抄送儔侍者子也參方要識真此行此語合書紳隨聲逐色塵難出絶慮忘緣道易親盡道有修還有證須知無法亦無人布毛吹起雙瞳碧碓觜花開劫外春次韻送傑侍者湘西昔日廓侍者當機熱喝駭同流羅籠迥脫摩霄鶻鞭索俱忘露地牛架箭張弓思石鞏呈橈舞棹笑岩頭扶桑東去煙波闊會有鯤鯨上直鈎送璨藏主道人學道莫遲留寒暑催人易白頭行腳既知明大事立心端合繼前修要知臨濟參黃檗須想雲門見睦州信手揭翻華藏海虗空背上恣遨遊寄全室和尚老去閒居傍帝畿承恩時復奉天威三經旨訣曾敷奏千聖真傳盡發揮佛印解來蘇子帶大顛留得退之衣朝賢問法多如雨一一提持向上機晏侍者有偈呈師次韻酬之二首楖栗橫擔鐵一尋遠辭京國到雲林將來廓徹人天眼向上研窮佛祖心誰道磨磚難作鏡我知點鐵易成金當機識得歸源旨琴鼓無絃有妙音佛祖話頭生鐵橛古今流播滿叢林莫圖聽我間饒舌切忌隨他錯用心玉假琢磨成美器礦因鍛煉出精金東山瓦鼓輕敲著却是虗空震吼音勉尊勝宗長老密意都盧在汝邊我無密語與人傳要為叔世光明種莫學他家默照禪取舍頓捐心量外行藏直透劫空前入垂手須方便末法今當一萬年次韻送勤侍者髑髏那畔有靈光日用明明不覆藏道絶言詮宜自省機同啐要相當謾跨洛浦辭臨濟長想龍湖見石霜四海叢林正寥落誰能赤手整頽綱追和雪峰空禪師分歲韻徑山遇歲與人分家宴才開自不羣木札煮羮香滿地鐵釘炊飯氣成雲薄批明月千餘片細切清風百數斤吹起少林無孔笛衲僧聞此未曾聞次韻答法姪澤藏主生佛已前一段事賤堪卑也貴堪尊正當語路無尋處方信禪家有悟門彈指直教三際斷到頭莫被六塵昏不因法姪來相過老我如何著口論送辨藏主問字惟將一默酬舌根不動辨如流擬尋玄路空篩力徹見真源始到頭革舄躡雲雙徑曉木杯載月洞庭秋明明函蓋蓋坤句竪抹橫該得自繇送願藏主發足參方志願堅祖師心印要親傳敲床對客機何別叉手酬僧話已圓徑塢幽深雲繞屋太湖空闊水連天了知法法無差互密意都來若箇邊送持藏主行藏與道不相離二六時中善護持頓息萬緣無異路才興一念有多岐明明豈假從他覓了了何妨得自知藏裏摩尼光烜赫拈來爍破衆人疑次韻贈法姪澤禪人袈裟提起黑㲯𣯶付囑多年出此菴祖道無傳當我責宗門有話向誰談慈明脫履對神鼎昭覺撞鐘接小南今日放卿三十棒現成公案不須參送胤藏主一大藏教一氣轉翻身跳出葛藤窠去來合轍皆繇我殺活當機不屬他稱過量人能有幾具超方眼亦無多江南兩浙參遊遍還把袈裟掛薜蘿次韻答萬壽伯瑩和尚二首間房壁觀觜盧都語默何曾涉市途但自機先提祖印從他肘後祕靈符鏡中𩬆髮千莖雪床角藤枝七尺烏只恐徵書天上至金襴特賜趂朝趨袈裟憶在寶珠峰曾共敷揚向上宗華偈聯篇光燁燁竹篦倒握勢隆隆誰云雪曲無人和自信玄關有路通別後早聞歸故里四方禪學盡趨風次韻答無文藏主尋師擇友事參方剖破疑團發慧光一句當機傳法印十年混跡在禪堂寒松聳幹凌霄秀秋菊垂花帶露黃妙用頭頭俱顯現了知祕藏不能藏送進藏主瞻風撥草為求師親到龍門更不疑極力成褫雖在我通身放下合繇誰要知道絶名模處須信機同啐時負汝負吾都莫問看他睡虎奮全威贈生維那子來覓偈擬何為去向諸方扣宿師句裏藏鋒須猛省機先嚙鏃莫遲疑當知覿面提持處正是全身放下時顧我不行興化令臨岐叮囑費言辭示儉侍者侍者參得禪了也烏藤三十未輕饒盡教衲子心機息方顯師家手段高鏡藉重磨光始現金繇百鍊礦全銷承虗接響知何限續斷應須煮鳳膠詩七言絶句奉和芥室和尚雜言四首沉空滯寂不回頭暑往寒來春復秋缺齒老胡辭竺國大乘根器出神州坐斷孤峰最上頭德山氣宇凜高秋一條白棓橫揮處千古威風四百州空齊不語獨搔頭搖落驚看覺苑秋書上萬言天子悅令人苦憶老藤州江北江南走競頭幾人葉落便知秋當年風穴辭南院七載單丁在汝州次韻東院和尚間居何事逢迎不下堂主賓道合貴情忘趙州千古高風在不出山門見趙王禮疏山祖師塔三更竊聽洞山禪父子從來妙不傳賣却布單緣底事至今活葬大江邊示僧修橋打硬工夫勢未休要看砥柱屹中流度驢度馬渾相似笑殺當年老趙州題倒騎牛水牯純來不著鞭平原漠漠草芊芊等間倒跨出門去橫笛一聲高徹天示文上人有指示時非指示無推尋處是推尋要明生佛已前事歇却馳求種種心送忠書記汝未濡毫文彩露我才開口舌頭僵虗空昨夜呵呵笑萬象森羅共舉揚示蘊侍者我宗無語亦無法紙襖抄來著甚忙父母未生前一句切須冷地裏思量奉寄芥室老和尚二首底事懷歸思不堪夢魂長繞緑蘿菴白頭遺叟空山裏知是何人侍夜談手携七尺古藤枝渡水穿雲孰可期逆順二途俱不涉分明說與老禪知寄玄極法兄三首為人不惜兩莖眉親見鞔峰老古錐少室宗綱今委地腕頭有力好扶持暮翁手提斷貫索曾從東海縛麒麟長竿此日拋香餌掣得金鰲有幾人三腳驢生闊角牛東西奔觸沒蹤繇從他露地憨眠去鼻孔無繩不用收示曇頓侍者省親二首鳥窠拈起布毛吹大似空拳誑小兒汝莫隨他顛倒想老僧無法可傳持父子恩親孰與齊卷衣別我數行啼到家莫負還山約折腳鐺兒要爾提送修禪人知識門庭似海深輕包短䇿好參尋千條山郭千條路一寸光陰一寸金化鐘大爐鞴裏翻身處開口當知有賞音多少師僧齊側耳聽渠號令震藂林次韻題漁隱江天空闊思悠悠魚鱉浮沉逐水流撥轉船頭東海上不妨重整釣鰲鈎送貞侍者鍾陵禪者到歐峰入室求聞向上宗我欲為渠施正令床頭拄杖未開封送空禪客目家活計沒些些撒出珍珠似土沙老我貧無錐可卓棒頭有眼辨龍蛇息心齊盡斷萬緣忘物我頓空三際絶名模夜明簾外泥牛吼覺海波瀾徹底枯送愈藏主龜毛拈向眼中栽惹得旁觀笑滿腮此去有人伸借問莫言親見徑山來析明覺大師迷悟相返四首霏霏梅雨灑危層孤坐寥寥萬慮澄門徑草深人跡少床頭間却一枝藤五月山房冷似氷紅塵市上閙奔騰利名心識都消歇徹底清間物外僧莫謂乾坤乖大信函蓋無私悉隨順滄海桑田自變更法法不離心地印未明心地是炎蒸明得依然似未曾珍重遍參諸祖客將來總可續真燈送衡侍者子也經年侍我旁了無一語可傳揚紙衣不用間抄寫三十烏藤要廝當送琄藏主三呼領旨水洗水一默酬僧空納空拔却長年釘根橛杖頭八面起清風送正藏主寶藏揭開何所有頭頭總是自家珍祖翁契券親收得儘可將來利濟人次韻送興藏主歸鍾山繁興永處那伽定道是無為即有為歸去鍾山問端的老禪不語笑微微示周普明居士念佛無非念自心自心是佛莫他尋眼前林樹并池沼晝夜還能演法音賀澤天霖住智門二首十年湖海飽咨參慣把龜毛拂子拈得座披衣當此日好弘法施播東南白岩大坐驗來參本色鉗槌要汝拈碁布藂林盡尊宿不知誰解作司南用韻自述二首佛也來時不放參德山白棓亦慵拈慚無機用堪施展掩室堆堆坐面南老來無復事朝參綵筆曾經對御拈叨沐君王賜方服中官送出午門南示胡覺堅居士人人自己天真佛晝夜六時常放光剔起眉毛親見得何勞特地禮西方次韻答南湖方丈松月禪翁的骨孫南湖坐斷合推尊晨參暮請多禪侶箇箇當機廓頂門送約首座兜率宮中說法回青天白日鼓風雷幾多滯殼迷封者奇特商量滿面埃贈振藏主經頭一字無人識注腳徒然有許多誰把吹毛三尺劒當陽截斷葛藤窠示道友欲究禪家向上機披精進鎧奮全威智刀裂破無明網管取心空及第歸示唐妙蓮道人五濁界中難久住茫茫劫海幾時枯等間一念空三際是則名為女丈夫古韶為塤侍者作太始希聲奏九成曾聞祥鳳舞虞庭金舂玉應三千載不是知音不易聽次韻送敬侍者鳥窠未舉布毛先開口分明落那邊堪笑會通機不密眼睛打失髑髏前送𦺈藏主侍者參得禪了也虗空昨夜笑咍咍人人本有光明藏金鎖還將玉鑰開贈中書記荷負如來最上乘百家異學亦兼能看他佛印元書記續得雲門五世燈瑞笋靈芽初長祇園裏終見參天發茂枝不為化龍頭角露丹山祥鳳欲來儀送真藏主悟得分明用得真入門相見體循循如來藏裏摩尼寶正眼看來亦是塵山居十首絶頂深居世念忘更無佛法可商量日高丈五眠方起一架薔薇花正香松根石上坐堆堆一片閒雲去又來靈利師僧相過少柴門終日為誰開滿目雲山春寂寂無言桃李晝酣酣萬機直下都休歇此道何勞更指南路入羊腸草拂腰數間茅屋傍山椒知心惟有天邊月幾度飛來伴寂寥香篆煙消午睡醒遠山入望碧層層清平世界無拘束一箇長行粥僧身上㲯毿布衲衣青灰抖擻滿窗飛門前小犬嘷嘷吠喜見山童負米歸空階雨後獨徘徊秋色蒼凉日影低樵唱一聲來谷口竹雞飛上樹頭啼處世心如臘月氷住山自笑百無能菜羮且莫熬油煮留點堂前供佛燈石室寥寥坐翠微江湖朋舊往來稀東南叢席多龍象知是何人唱祖機間居隨分度年華力荷先宗愧出家刮地朔風連夜起又看春色到梅花秋日山中即事五首罷山行折桂枝幽蘭移得向階墀青青菜甲園中長白匾豆花開滿籬煮菜無鹽懶去賒化糧道者未還家一條百衲拈來看昨夜霜添瓦上花老來棲息愛林泉垂手何心更入𢌅試拂床根雙草履天晴移晒屋檐前黃葉飄風滿地秋山房終日冷湫湫㸑夫靠晚樵青至摘得藤梨在擔頭蕎麥花開曉日晴喚來童子聽叮嚀好將紫芋收歸了携取長鑱劚茯苓
