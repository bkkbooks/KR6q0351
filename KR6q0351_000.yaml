front:
  text: 呆菴莊禪師語錄總目卷之一南康雲居真如禪寺語錄卷之二杭州徑山興聖萬壽禪寺語錄卷之三小參卷之四拈古三十八則卷之五頌古四十七則卷之六偈二十九首歌六首吟一首卷之七詩七言八句二十四首七言絕句六十五首卷之八詩五言八句二十一首讚佛祖讚二十七首自讚六首塔銘呆菴莊禪師語錄總目終
