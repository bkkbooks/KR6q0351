body:
  text: 門人慧啓等編雲居語録師入寺指山門云大啓重關全提正令水赴雲趨金舂玉應據室云從上老古錐向這裏說東道西欺胡瞞漢新長老到來一時亡鋒結舌去也拈拄杖澤廣藏山理能伏豹卓拄杖拈劄靈山付囑驗在今日佛法遍天下皇恩無盡時升座拈香罷問答不録師乃云道在目前目前非道迷者自迷悟者自悟不容擬議寧涉言詮但能廓爾忘緣自然觸處顯露饒汝舉古舉今說玄說妙巧逞機辨大振家風我說總是顛倒妄想佛佛授手祖祖相傳正眼看來也是承虗接響驀拈拄杖召大衆云雲居今日事不獲已更成一場敗闕三十年後未免遭人檢點卓拄杖千峰勢到嶽邊止萬派聲歸海上消開寺基示衆昨日開荒地請諸人剗却荊棘除去瓦礫本來基址已見分明只有中間樹子無人拔得山僧今日未免別行方便利刀剪盡繁枝葉鈍钁深鋤邪倒根實地工夫成一片住山鈯斧了無痕上堂舉雲門大師云平地上死人無數出得荊棘林是好手時有僧云恁麼則堂中上座有長處門云蘇嚧蘇嚧師云雲門與麼道雲居則不然平地上活人無數入得荊棘林是好手忽有人出來說長說短拈拄杖劈脊便打何故水流濕火就燥禍福無門惟人自召師凡見僧便問近奉公文務要打點上座僧云某甲不是姦細師云也須勘過始得僧云和尚莫得倚勢欺人師展手云把將公驗來僧擬議師掌之有僧云久聞和尚有此機要師云山僧失利珍藏主火從門入者不是家珍三乘教典都無實義喚作火則燒殺你不喚作火則凍殺你師因僧問承聞和尚有打點之機是否師熟視云汝來自首那僧云學人掀倒禪床去也師云汝是甚處人僧云高著眼師云這依草附木底精靈法華會上堂久默斯要不務速說今當說之各宜善聽良久云我不敢輕於汝等汝等皆當作佛示衆夫為宗師者不得已垂示一言半句無非為學者抽釘拔楔解粘去縛譬如善舞太阿自然不傷其手近代據師位訓學徒記持文字崇飾語言誇耀後來增長惡習不知有自己出身之路如衣壞絮行棘林中不能自由少林直指之宗於此墜地良可痛傷海輩行腳各須帶眼莫教墮他網中出頭不得只如古人道入此門來莫存知解若約山僧見處直饒知解頓忘猶是門外漢到者裏須辨緇素始得珍重師一日問新到云我這裏虎狼塞路荊棘參天上人到來有何忙事僧云特來禮拜和尚師云入門一句則不問且道腳跟下草鞋甚處得來僧擬議師便喝又問昨日離何處僧云廬山師云不勞再勘師因鏟草次有僧問這片田地幾時剗得乾淨師舉起鋤頭云不得喚作鋤頭未審上座喚作甚麼僧無語師拋下鋤頭云這片田地幾時剗得乾淨解夏上堂聖制告圓正是今日諸方叢席說禪說道閙浩浩地我這裏孤逈逈峭巍巍縱有佛法誰著眼拍禪床下座上堂僧問如何是學人自己師云阿誰教汝與麼問僧禮拜師乃云觸目不會道運足安知路古人與麼道大似勞而無功山僧見處也要諸人共知驀拈拄杖卓一下云但得雪消去自然春到來便下座師一日有二僧請益師垂問云盡大地是當人自己向甚處安眼耳鼻舌身意僧無語又問第二僧須彌峰磕碎汝髑髏因甚不知痛覺僧亦無語師回顧侍者記取這兩轉語上堂舉葉縣省禪師上堂云廣教有驗人關截人機活人句還有人道得麼若是道不得孤負平生師云雲居也無驗人關也無截人機也無活人句還有道得者麼若是道不得辜負山僧回顧侍者云且道古人底是老僧底是侍者無語師以拂子驀口打上堂夜來夢中舉一則因緣會中有三人悟道候到天明舉似大衆一時忘却且待老僧更思量看良久云汝等諸人總來者裏聽我說夢著甚來由以拄杖一時趂散上堂儒書云百姓日用而不知佛經云衆生日用而不覺山僧道知得也是間覺得也是妄這箇說話不是抑他古人須是自己眼活始得擊拂子千江有水千江月萬里無雲萬里天師因僧問如何是和尚著實為人處師云我何曾向汝說虗頭來僧云本色宗師天然有在師拈拄杖打一下云這掠虗漢不打更待何時上堂禪不可參道不可學學道參禪無繩自縛金毛獅子奮全威祥麟只有一隻角畢竟如何趙州觀音院裏壁上掛箇葫蘆有時風吹歷落歷落上堂法不孤起仗境方生客來須看賊來須打衲僧門下道出常情作麼生與他相見向下文長付在來日上堂雲片片水潺潺舉目千山復萬山山容寂寂鳥語關關門前古路平如砥不與時人共往還擊拂子便下座上堂一切衆生為物所轉若能轉物即同如來諸禪德彼此丈夫莫受人謾且所轉是甚麼物能轉又是甚麼釋迦老子好與二十棒雖然放過也好劒隨風浪化莫記刻舟痕化主回上堂禪子臨川化導歸入門一笑展雙眉破微塵出大經卷打鼓椎鐘報衆知正與麼時且道功歸何所昨夜春回空劫外覺華香綻不萌枝祖忌拈香來時缺兩齒去時留一履這個老胡僧孟浪絶倫比乃喚云者裏還有祖師麼老僧與伊廝見則箇以香置爐云莫怪空疏伏惟珍重因雪上堂大地雪漫漫山深分外寒斷肱人不到面壁也無端大衆且道是祖師無端山僧無端拈拄杖擲下云無端無端元旦上堂天得一以清地得一以寧君王得一致太平衲僧得一滴水氷生拈拄杖只如拄杖子得一時如何直示新年頭佛法敲風打雨任縱橫靠拄杖上堂今朝正月十五緇白填門塞戶侍者才覆上堂道人擊動法鼓老僧狼忙出來何暇舉今論古平生貶剝諸方今日一場莽鹵大衆莽鹵則不無也須知時識宜始得不如詐啞佯聾冷地看他村歌社舞擊拂子下座敘謝兩序上堂打開寶藏運出家珍普濟羣生悉令充足金剛圈栗棘蓬總是閒家潑具只如遇賤則貴逢低則高不傷物義一句合作麼生饡飯從教香馥郁紙衣莫使墨淋漓上堂春日晴黃鶯鳴雜花開爛熳老樹聳崢嶸人在碧溪橋上立水流東去聽無聲拍禪床下座師因僧問騎虎頭撩虎尾中間事作麼生師云渠儂得自由僧云只如古人道我也弄不出意且如何師云入水見長人師問僧云一句內二句外明得是第幾機僧擬對師云擬心即差開口即失去浴佛上堂真佛無形浴箇什麼毗藍園裏妄見空花雲門令行不到今日驀拈拄杖召大衆云今日事作麼生昆明池裏失却劒曲江江上撈得鋸卓拄杖結夏上堂九旬禁足今朝始特地升堂為指南一念不生三際斷百千諸佛是同參同參事則不問且道百千諸佛只今向甚處安身立命擊拂子手執夜明符幾個知天曉上堂舉道吾問雲岩云脫却殼漏子向什麼處相見岩云向不生不滅處相見吾云何不道非不生不滅處相見師拈云不生不滅與非不生不滅處總無相見分若有人問雲居脫却殼漏子向什麼處相見只向他道什麼處不相見驀拈拄杖畫一畫下座師問僧云汝與麼遠來親附老僧他時異日忽有人問老僧還有為人處也無汝作麼生答僧擬進語師呵云去莫道曾見老僧來上堂我這裏無佛法可說無禪道可學汝諸方說得底學得底直須盡情放下內無所守外無所倚不妨做個灑灑落落衲僧正與麼時更須知有轉身一路始得擊拂子紅霞穿碧落白日繞須彌上堂心法無形通貫十方十方無壁落四面絶遮欄可憐傅大士處處失樓閣寒山拾得更是討頭鼻不著便下座上堂解夏之後東去西去南去北去直須向高高山頂立深深海底行若是閨閣中物捨不得未免墮坑落塹擊拂子當門更不栽荊棘免被人來惹著衣上堂雲居沒能為只麼隨緣過飢來索飯噇困來伸腳臥禪亦不能參偈亦不會做談玄說妙人總似驢拽磨上堂老僧開荒時於法堂基上掘得一箇鈯斧子久聚兄弟若有用得著者兩手分付若是荷負不去老僧收得來著甚死急不如揚向垃圾堆頭從他日炙風吹去也驀拈拄杖卓一下云鞭起鐵牛耕大地誰能井底種林檎開爐上堂舉趙州和尚指火示僧云我喚作火你不得喚作火師云趙州老老大大剛要挑灰弄火雲居則不然相共圍爐燒火向主賓道合自忘言上堂語中有語名為死句語中無語名為活句幾人向活句中死却幾人向死句中活却更有一人能死能活坐斷一切語句却來雲居手中覓棒吃因向他道且莫草草匇匇明日來與汝一坑埋却何故易分雪裏粉難辨墨中煤義藏主火與汝往來者是藏不與汝往來者亦是藏要明第一義諦切忌死他語下以火把打一圓相云月不待風而凉日不待火而熱擲下火正旦上堂一切無情皆有佛性晨朝起來慶賀新年法堂上撞著露柱禮他三拜有何不可安樂山神無端性懆鼓合點胸尊者在佛殿基上說是說非總與二十拄杖趂出趙州關外去也不見道三千條令主者施行應高僧選退院上堂我來雲中居五載如轉燭所樂在忘緣心心自知足虗名不可逃驛書到空谷笑看折腳鐺委置憑誰續摩挲七尺藤光漆耀人目用捨各有時去住何拘束珍重同道流共唱清平曲驀拈拄杖召大衆云且道清平曲是甚腔調喝一喝下座
