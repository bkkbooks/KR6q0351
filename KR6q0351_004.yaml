body:
  text: 門人智勝等編拈古舉世尊因五通仙人問世尊有六通我有五通如何是那一通佛召仙人五通應諾佛云那一通你問我拈云仙人善問世尊善答可謂光前絶後若是那一通總未夢見在舉阿難尊者問迦葉尊者師兄世尊傳金襴外別傳何物葉召云阿難難應諾葉云倒却門前剎竿著拈云若向剎竿未倒時會得埋沒先宗若向剎竿倒却後會得辜負自己且道世尊傳金襴外畢竟別傳何物三面狸奴腳踏月兩頭白牯手拏煙舉二祖問達磨大師云我心未寧乞師安心磨云將心來與汝安祖云覔心了不可得磨云與汝安心竟拈云殺人須是殺人刀活人須是活人劒舉六祖因僧問黃梅意旨什麼人得祖云會佛法人得僧云和尚還得否祖云我不得僧云和尚為什麼不得祖云我不會佛法拈云得與不得會與不會即不問祖師性命因甚落在者僧手裏擊拂子下座舉國一欽禪師因馬大師遣人送書到書中作一圓相國一發緘遂於圓相中著一點却封回後忠國師聞云欽師猶被馬師惑拈云箭鋒相直縱奪當機還他馬祖國一始得驀拈拄杖召大衆云只如國師道欽師猶被馬師惑畢竟意在於何卓拄杖舉馬祖因僧參次乃畫一圓相云入也打不入也打僧才入祖便打僧云和尚打某甲不得祖靠拄杖休去拈云大師令雖行爭奈無風起浪者僧棒既喫了要且有理難伸復云作麼生會他休去底道理舉南泉示衆云王老師賣身去也還有人買麼時有僧出衆云某甲買泉云不作貴不作賤你作麼生買僧無對拈云山僧若作者僧待他道不作貴不作賤你作麼生買即對他道和尚鼻索在某甲手裏直饒王老師別有長處也只得忍氣吞聲舉歸宗因普請入園取菜乃畫一圓相圍却一株菜以標插之語首座大衆云輒不得動著各下一轉語來是時一衆各呈見解未嘗有契者宗以棒趂云者一隊漢無一箇有智慧喫却我多少菜不能與園頭出氣乃踏倒標子拽著菜株而歸拈云設有僧拔却者一株菜莫契得歸宗麼拈拄杖敲香几云歸宗和尚來也靠拄杖舉志公令人傳語思大云何不下山教化衆生目視雲漢作麼思大云三世諸佛被我一口吞盡何處更有衆生可化拈云兩個漢總與一坑埋却不為分外雖然也不得草草良久雲自帝鄉去水從江漢流舉鹽官示衆云虗空為鼓須彌為槌什麼人打得衆無對南泉云王老師不打者破鼓拈云南泉與麼道鹽官還肯伊也無山僧即不然虗空為鼓須彌為槌什麼人打得但向他道打即不辭只是罕遇知音舉盤山一日出門見人舁喪歌郎振鈴云紅輪決定沉西去未委魂靈往那方幕下孝子哭云哀哀山忽身心踴躍歸舉似馬祖祖印可拈云夫為人師者須具透關眼別邪正驗來機只如盤山認箇昭昭靈靈以為極則馬大師從而印可豈不孤負先聖欺罔後昆山僧此間若有這般人必然別有生涯鴛鴦繡出從君看不把金針度與人舉藥山晚參云我有一句子待特牛生兒即向汝道時有僧出云特牛生兒也只是和尚不道山喚侍者將燈來僧便抽身入衆拈云大小藥山龍頭蛇尾者僧只知捉月不覺水深大衆特牛生兒也山僧向汝道問將一句來舉芙蓉育禪師因龐居士問馬祖著實為人處還分付吾師否蓉云某甲尚不見他作麼生知他著實處士云只此見解也無討處蓉云居士也不得一向言説士云一向言説師又失宗若作兩向三向師還開得口麼蓉云直似開口不得可謂實也士撫掌而去拈云芙蓉無端惹起許多葛藤若約徑山見處便與攔胸一踏直饒龐居士知有馬大師著實處也做手腳不及舉金牛和尚凡自做飯供養衆僧每至齋時舁飯桶云僧堂前作舞云菩薩子喫飯來乃撫掌大笑拈云賊身已露舉龐居士問馬祖不昧本來人請師高著眼祖直下士云一種沒絃琴唯師彈得妙祖直上士乃作禮祖便歸方丈士隨入云弄巧成拙拈云我要問龐居士喚甚麼作本來人作麼生是沒絃琴拈拄杖不是放過馬大師只是不欲説破卓拄杖舉雲岩問百丈和尚每日區區為阿誰丈云有一人要岩云因甚不教伊自作丈云他無家活拈云明眼人瞞他一點不得還會麼解弄不須霜刃劒延齡何必九還丹舉烏臼和尚因玄紹二上座來參臼問二禪伯發足甚處玄云江西臼拈棒便打玄云久知和尚有此機要臼云你既不會後面箇祗對看紹擬近前臼便打云信知同坑無異土參堂去拈云平地上𡽗崖孤峻處平坦諸方祇知烏臼具超宗越格手段且不知烏臼徹底老婆心要識老婆心麼棒打石人頭𥗋𥗋論實事舉僧問趙州二龍爭珠誰是得者州云老僧只管看拈云爭者不得得者不爭趙州只管看要且不識珠舉黃蘗因百丈問甚處來蘗云山下採菌子來丈云還見大蟲麼蘗便作虎聲丈拈斧作砟勢蘗遂與丈一摑丈吟吟而笑便歸升座謂衆曰大雄山下有一大蟲汝等諸人也須好看百丈老人今日親遭一口拈云師資相得針芥相投機鋒互換照用齊行譬如二龍爭珠拏雲攫霧不動波瀾二虎奪食活捉生擒不傷物命有者道百丈無陷虎之機黃蘗有超師之作如斯理論刺腦入膠盆以拂子畫一畫擘開華嶽連天秀放出黃河徹底清舉洞山示衆云秋初夏末東去西去直須向萬里無寸草處去始得只如萬里無寸草處作麼生去有僧舉似石霜霜云出門便是草師拈拄杖云總向草裏輥有甚了期卓拄杖云㘞舉趙州因僧問學人乍入叢林乞師指示州云喫粥了也未僧云喫粥了州云洗盂去其僧因此契悟雲門云且道有指示無指示若云有趙州向伊道什麼若云無者僧為甚悟去拈云趙州以楔出楔雲門看樓打樓者僧悟去還有勘處也無良久風不鳴條雨不破塊舉趙州因僧遊五臺山凡問一婆云臺山路向甚處去婆云驀直去僧才行三五步婆云好個師僧又恁麼去後有僧舉似州州云待我為勘過者婆子明日便去亦如是問婆亦如是答州歸謂衆曰臺山婆子我為勘破了也拈云衆中盡道趙州勘破婆子殊不知婆子勘破趙州舉睦州示衆云你等諸人若未得箇入頭須得箇入頭若得箇入頭不得孤負老僧拈云大小睦州通身泥水我則不與麼遂厲聲召衆云退後退後衆擬議拈拄杖一時趂出舉仰山坐次大禪佛到翹一足云西天二十八祖亦如是唐土六祖亦如是和尚亦如是某甲亦如是山下禪床打四藤條拈云阿魏無真水銀無假舉德山示衆云問即有過不問有乖時有僧出作禮山便打僧云某甲話也未問因甚便打山云待你開口堪作何用拈云德山權柄在手殺活臨時者僧久經行陳奮不顧身然雖如是未免二俱不了還有緇素得出者麼真金自有真金價終不和沙賣與人舉臨濟升堂有僧出濟便喝僧亦喝便拜濟便打拈云譬如水母無目求食須假於蝦明眼衲僧不妨辨取舉投子因僧問依俙似半月倣佛若三星乾坤收不得師於何處明子云道什麼僧云想師只有湛水之波且無滔天之浪子云間言語拈云設有人與麼問山僧亦云道什麼待他道只有湛水之波且無滔天之浪腳跟下痛與一頓拈拄杖云有麼有麼靠拄杖云縱饒栽種得不是棟梁材舉曹山因僧問學人抱璞投師請師雕琢山云不雕琢僧云為甚不雕琢山云須知曹山好手拈云且道者僧會曹山語不會曹山語山僧道直饒會得也是無端舉興化升堂云今日不用如何若何便請單刀直入興化與你證據時有旻德長老出禮拜起便喝化亦喝德又喝化又喝德禮拜歸衆化云適來若是別人三十棒一棒也較不得為他旻德會一喝不作一喝用拈云二尊宿一人買帽相頭一人隔靴抓癢雖則一期施設爭奈𮞏相鈍置何故見義不為何勇之有舉湧泉因雪峯來訪乃門送峯入簥了泉云者箇四人舁那箇幾人舁峰乃踊身起云道什麼泉再問峯云行他不會泉云知即知只是道不得拈云有主有賓全收全放直須識取湧泉雪峯脫或未然切忌向虗空裏釘橛舉岩頭參德山才跨門便問是凡是聖山便喝岩便拜洞山聞舉乃云若不是豁老也大難承當岩云洞山老漢不識好惡錯下名言我當時一手擡一手搦拈云德山不無養子之緣洞山乃是因齋慶贊作麼生是岩頭一手擡一手搦不是射雕手徒説李將軍舉雲門示衆云聞聲悟道見色明心作麼生是聞聲悟道見色明心乃云觀世音菩薩將錢買胡餅放下手却是饅頭拈云我不似雲門認奴作郎指鹿為馬驀拈拄杖云看看拄杖子穿過諸人髑髏卓拄杖舉玄沙因光侍者道師叔若會禪某甲打鐵船下海去玄沙住後令人馳書問光云打鐵船也未拈云者箇公案諸方批判者不為不多然只能扶強不能扶弱山僧今日久勘不離元狀敢謂玄沙被光侍者領過直爾分疏不下畢竟如何官無定條從民私約舉南院因僧問赤肉團上壁立千仞豈不是和尚語院云是僧便掀倒禪床院云你看者瞎漢亂做僧擬議院便打出拈云重賞之下必有勇夫舉長慶云總似今日老胡有望拈云金將石試保福云總似今日老胡絶望拈云玉將火試擊拂子一年春已過臺榭緑陰多舉風穴因僧問語默涉離微如何通不犯穴云常憶江南三月裏鷓鴣啼處百花香拈云者僧與麼問風穴與麼答似則似矣是則未是雖然你要見他風穴三生六十劫舉首山拈竹篦示衆云喚作竹篦即觸不喚作竹篦即背諸人喚作什麼葉縣省近前掣得折作兩截拋向階下却云是什麼山云瞎縣便禮拜拈云脫體風流須是首山當機抗敵還他葉縣一向與麼去臨濟佛法掃土而盡舉汾陽示衆云識得拄杖子行腳事畢拈云汾陽一條拄杖換却天下衲僧眼睛舉松源和尚臨終示衆云久聚正路行者有只不能用黑豆法難以荷負正宗臨濟佛法到此平沉痛哉痛哉拈云松源老祖壓良為賤若是黑豆法用得有甚奇特直須將斷貫索穿過從上佛祖鼻孔方有自由分時有僧云斷貫索莫在和尚手中麼師云這瞎漢拈拄杖便打
