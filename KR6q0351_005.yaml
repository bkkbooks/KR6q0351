body:
  text: 門人德琇等編頌古舉世尊一日升座文殊白槌云諦觀法王法法王法如是世尊便下座頌曰文殊白槌世尊下座露柱燈籠分明說破汝等師僧還委悉麼水長船高泥多佛大舉世尊因外道問不問有言不問無言世尊良久據坐外道讚曰世尊大慈開我迷雲令我得入禮拜而去後阿難問佛外道有何所證讚嘆而去佛云如世良馬見鞭影而行頌曰不問無言與有言倚天長劒寶光寒良駒何待搖鞭影慶喜無端被熱謾舉世尊在靈山會上拈華示衆是時衆皆罔措唯迦葉尊者破顏微笑世尊云吾有正法眼藏涅槃妙心付囑摩訶迦葉示衆拈華處破顏微笑時靈山百萬衆到此盡驚疑舉達磨大師因梁武帝問曰如何是聖諦第一義師曰廓然無聖帝曰對朕者誰師曰不識帝不契師遂折蘆渡江胡僧齒缺舌頭長出語如何契帝王折得莖蘆渡江去也知無地著慚惶舉六祖大師因風揚剎竿二僧對論一云風動一云幡動往復曾未契理祖云不是風動不是幡動仁者心動二僧悚然不是風兮不是幡翻身透出萬重關笑看天上團團月影落澄潭徹底寒舉南陽忠國師一日三喚侍者侍者三應喏師曰將為吾辜負汝却是汝辜負吾會得三呼三應說甚負汝負吾咬人罕逢師子逐塊多見韓盧舉馬祖與百丈西堂南泉玩月次祖曰正當與麼時如何堂曰正好修行丈曰正好供養泉拂袖便行祖曰經入藏禪歸海唯有普願獨超物外馬祖堂前玩月時三人兄弟各呈機一般醜惡難藏掩爭免傍觀說是非舉百丈再參馬祖祖見來豎起拂子丈云即此用離此用祖以拂子掛舊處良久云汝以後開兩片皮將何為人丈亦豎起拂子祖云即此用離此用丈亦掛拂子於舊處祖振威一喝百丈直得三日耳聾後因黃蘗來參舉此蘗遂吐舌拈來放去不多爭父子相將草裏行一喝耳聾容易曉舌頭吐出最難明舉馬祖不安院主問和尚近日尊候如何祖曰日面佛月面佛日面月面隨方應現具眼衲僧有甚難見曉來雨過長江風動蘆花兩岸舉南泉因兩堂首座爭猫兒泉乃提起云道得即救取道不得即斬却衆無對泉遂斬之至晚趙州自外歸泉舉似趙州州脫草履安頭上而出泉云汝若在即救得猫兒當陽提起箇猫兒道得分明救得伊直下一刀成兩段草鞋戴出亦徒為舉陸亘大夫問南泉云肇法師也甚奇怪解道天地同根萬物一體泉指庭前牡丹云大夫時人見此一株花如夢相似天地同根會也麼庭前指出牡丹花黃金把得和沙賣誰謂南泉是作家舉鹽官一日喚侍者云與我將犀牛扇子來侍者云扇子破也官云扇子既破還我犀牛兒來侍者無對犀牛扇破重索犀牛鹽官老漢好不知羞舉魯祖凡見僧來便面壁魯祖見僧惟面壁宗師何用口喃喃怪來昔日毗耶老獨與文殊作對談舉德山初見龍潭便問久嚮龍潭及乎到來潭又不見龍又不現潭曰子親到龍潭千古龍潭水渺瀰德山親到更何疑頂門有眼明如日腳下泥深總不知舉丹霞到一荒院遇夜取木佛燒火向院主乃呵責曰何得燒我木佛霞以拄杖撥火云燒取舍利院主云木佛何得有舍利霞云若無舍利更取兩尊來燒院主嗣後眉鬚墮落丹霞燒木佛院主墮眉鬚去得眼中屑重添腦後錐舉趙州一日訪茱萸將拄杖於法堂上東行西行萸云作什麼州云探水萸云我者裏一滴也無州將拄杖靠壁便出趙州探水到茱萸徹底爭知一滴無拄杖當時將靠壁分明直處却成紆舉僧問洞山如何是祖師西來意山云待洞水逆流即向汝道宗師開口不留情只要當人實地行洞水逆流終可待西來祖意教誰明舉仰山問中邑如何得見性去邑云譬如一室有六窗內有一獼猴外有一獼猴從東邊喚猩猩獼猴即應如是六窗俱喚俱應山禮謝云適蒙和尚譬喻無不了知更有一事只如內獼猴瞌睡外獼猴欲相見時如何邑下禪牀執仰山手作舞云猩猩與汝相見了問來親切答去分明抑揚有準敲唱雙行獼猴瞌睡不瞌睡六窗正好喚猩猩舉僧問趙州如何是祖師西來意州云庭前柏樹子潦倒趙州全勝敵藏鋒露刃總由他當陽指出庭前柏爭似逢僧喚喫茶舉昔有一婆子供養一菴主經二十餘年令一二八女送飯給侍一日令女子抱定云正當與麼時如何主云枯木倚寒岩三冬無暖氣女子歸舉似婆婆云我二十年來祇供養得箇俗漢遂趂出放火燒却菴婆子燒菴話禪人著眼看三冬無暖氣六月雪霜寒舉定上座問臨濟如何是佛法大意濟下繩牀擒住與一掌便托開定佇立傍僧云定上座何不禮拜定方禮忽大悟師資會遇固非輕報汝諸人好辨明紅芍藥邊方舞蝶碧梧桐裏正啼鶯舉雪峰示衆云盡大地撮來如粟米粒大拋向面前漆桶不會打鼓普請看大地撮來如粟粒等間著骨毛寒雪峯為物垂慈切打鼓從教普請看舉僧問道吾如何是和尚深深處吾下禪牀作女人拜云謝子遠來無可祗待直示深深處還他向上人下床施女拜祗待更殷勤舉靈雲見桃花悟道有頌云三十年來尋劒客幾回葉落又抽枝自從一見桃花後直至如今更不疑後玄沙聞云諦當甚諦當敢保老兄未徹在桃花一見更無疑大小靈雲眼𥉌𭿇笑殺釣漁船上客無端摘葉又尋枝舉臨濟將遷化時囑三聖曰吾去世後不得滅却吾正法眼藏聖曰爭敢滅却濟曰忽有人問汝作麼生道聖便喝濟曰誰知吾正法眼藏向者瞎驢邊滅却喝下全生殺機先辨正偏誰知正法眼滅向瞎驢邊舉雲門以拄杖示衆云拄杖子化為龍吞却乾坤了也山河大地甚處得來雲門拄杖化龍去吞却乾坤只等間我若見時須拗折免教一向管窺斑舉投子因僧問如何是十身調御師下禪牀立又問凡聖相去多少師亦下禪牀立射虎不真徒勞沒羽向上提持還他投子可憐馳逐天下人五五依然二十五舉僧問洞山如何是佛山云麻三斤生殺從來總自由三邊戈甲一時收誰知不用施韜略坐鎮中原四百州舉趙州和尚云一切人被十二時使老僧使得十二時趙州老古錐使得十二時床上破蘆䕠手中粗辣梨舉僧問風穴如何是佛穴云杖林山下竹筋鞭杖林山下竹筋鞭一句如何舉得全生鐵鑄成金彈子扶桑人種陝西田舉唐朝因禪師微時常運椎擊土塊次見一大塊戲椎猛擊之應碎忽然大悟後有老宿聞云盡山河大地被因禪師一擊百雜碎一擊百雜碎萬象齊慶快大好因禪師是什麼土塊舉僧問馬祖如何是佛祖云即心即佛又僧問如何是佛祖云非心非佛即心即佛成妄見非佛非心妄轉多拈却兩重關棙子大平何用動干戈舉黃龍南禪師三關語頌曰我手何似佛手舉起便合知有等間拶破虗空正好藏身北斗我腳何似驢腳開口不妨道著須信趙州石橋不比尋常略彴人人有個生緣會得只在目前不識寒山拾得喚作文殊普賢舉鳥窠和尚因會通侍者告辭往諸方學佛法去師曰若是佛法吾此間亦有少許通曰如何是和尚此間佛法師於身上拈布毛吹示之通大悟日用現行明歷歷擬心湊泊即瞞頇布毛吹起無多子也要當人著眼看舉五祖演和尚室中問僧云釋迦彌勒猶是他奴且道他是阿誰描不成兮畫不成娘生面目甚分明從他逼塞虗空去休更人前喚小名舉兜率悅禪師設三關問學者曰撥草參玄只圖見性即今上人性在甚麼處識得自性方脫生死眼光落地時作麼生脫脫得生死便知去處四大分離向甚麼處去早間吃粥齊時吃飯兩箇五百元是一貫貴買賤賣少減多添要識李四問取張三干木隨身逢場作戲杲日麗天清風匝地舉德山到溈山挾復子於法堂上從西過東邊從東過西邊顧視云無無便出德山至門首却云也不得草草便具威儀再入相見溈山坐次德山提起坐具云和尚溈山擬取拂子德山便喝拂袖而出背却法堂著草鞋便行溈山至晚問首座適來新到在什麼處首座云當時背却法堂著草鞋出去也溈山云此子已後向孤峯頂上盤結草菴呵佛罵祖去在寶鏡當臺驗作家德山著眼生花翻身坐斷孤峯頂一味逢人撒土沙舉僧問趙州和尚初生孩子還具六識也無州云急水上打毬子僧復問投子急水上打毬子意旨如何子云念念不停流急水灘頭解打毬誰云念念不停流茫茫六合人如海脫體風流是趙州舉趙州問投子大死底人却活時如何子云不許夜行投明須到死中得活亦非常切忌逢人錯舉揚昨夜面南看北斗腳跟不動到家鄉舉僧問大龍色身敗壞如何是堅固法身龍云山花開似錦澗水湛如藍山花似錦水如藍切忌承言落二三堅固法身遭指注大龍有口只宜緘舉天平依和尚行腳時參西院常云莫道會佛法覓個舉話人也無一日西院遙見召云從依平舉頭西院云錯平行三兩步西院又云錯平近前西院云適來者兩錯是西院錯上座錯平云從依錯西院云錯平休去西院云且在這裏過夏共上座商量這兩錯平當時便行後住院謂衆云我當初行腳時被風吹到思明長老處連下兩錯更留我過夏待共我商量我不道恁麼時錯發足南方去時早知道錯了也天平行腳到西院其奈連施兩錯何待共商量留過夏至今錯解不勝多舉保壽開堂三聖推出一僧壽便打三聖云恁麼為人非但瞎却這僧眼瞎却鎮州一城人眼去在保壽擲拄杖下座手面機輪全殺活棒頭照用要分明果然瞎一城人眼凌辱宗風兩弟兄舉僧問雲門如何是清淨法身門云花藥欄僧云便與麼去時如何門云金毛獅子無中唱出老雲門拍拍當機調自新花藥欄雖容易見爭如北斗裏藏身
